[package]
name = "darling-lifecycle-operation-boundary"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "=0.2.186"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rustix = { version = "=1.1.4", default-features = false, features = ["event", "fs", "net", "pipe", "process", "rand", "std"] }

[[bin]]
name = "lifecycle-boundary"
path = "src/bin/lifecycle-boundary.rs"

[[bin]]
name = "lifecycle-fuzz"
path = "src/bin/lifecycle-fuzz.rs"

[[bin]]
name = "darling-scratch-census"
path = "src/bin/darling-scratch-census.rs"

[[bin]]
name = "darling-lifecycle-controller-worker"
path = "src/bin/darling-lifecycle-controller-worker.rs"
