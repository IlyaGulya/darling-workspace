# Structured runner inputs for the selected installed runtime.
# Host fixtures use current workspace modules; no source or deployment recipes.
# Distinct declarations deliberately retain distinct stable ids.
version: 1
workloads:
- id: iosapp-archive
  module: darling
  name: iosapp-archive
  kind: guest
  coverage-tier: runtime
  env: darling
  diag: bare
  runner: guest-runtime-script
  repo: darling-workspace
  script: scripts/xcodebuild-workload-run.sh
  args:
  - --workload
  - iosapp-archive
  prefix-controller: true
  requires:
  - darling-prefix
  requires-env:
  - XCODEBUILD_WORKLOAD_XCODE_APP
  - XCODEBUILD_WORKLOAD_LOG_DIR
  timeout-seconds: 600
  verify-clean-shutdown: true
  note: >-
    Explicit diagnostic Release archive of the checked-in shared iosapp scheme,
    followed by structural iOS arm64 validation and deterministic unsigned IPA
    retention. The existing prefix-controller lends its lease to the shared
    xcodebuild runner; that runner alone owns guest boot and ordinary cleanup.
    Supply the selected Xcode app and a fresh evidence directory through the
    required environment inputs. Authorizes the shared real Xcode license
    preparation, not a license bypass. No signing, development export or device
    installation claim. Existing minproj/iosapp/both selections are unchanged.
- id: comparison_on_ring_fd_lifetime
  requires-build-features:
    DARLING_RING_TRANSPORT: true
    DSERVER_RING_TRANSPORT: true
  env-vars:
    DARLING_ROOTLESS_SHELLSPAWN_READY_TIMEOUT_MS: '60000'
    DARLING_SERVER_ATTACH_CENSUS: '1'
    DARLING_SERVER_RPC_HEATMAP: '1'
    DARLING_SERVER_MODE: balanced
  module: darling
  bead: dar-gwn.7.7
  name: comparison_on_ring_fd_lifetime
  kind: guest
  coverage-tier: runtime
  diag: guarded
  runner: guest-c-fixture
  repo: darling-workspace
  script: tests/shmem_ring_fd_ownership_guest.c
  ok-marker: RING_FD_INHERITANCE_OK
  compile-flags:
  - -std=gnu11
  - -Wall
  - -Wextra
  - -Werror
  requires:
  - darling-prefix
  timeout-seconds: 120
  env: darling
