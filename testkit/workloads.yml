  guest-cc: /Volumes/SystemRoot/home/ilyagulya/work/local-target/xcode-26.3/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang
  guest-cflags: -isysroot /Volumes/SystemRoot/home/ilyagulya/work/local-target/xcode-26.3/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
  requires:
  - darling-prefix
  note: "Permanent guest oracle for the CFDateFormatter/NSDateFormatter path Xcode3Core's error-printing\n\
    code uses, and the fix that unblocks it: the ICU DATA file the date formatter needs.\n\nTHE WALL THIS\
    \ CLOSES. After +[NSDate now] (foundation/nsdate-now.patch), the Xcode ladder died\none frame later\
    \ in the same error-triage path, in THIS tree's CoreFoundation:\n\n  CORE-FAULT .../CoreFoundation\
    \ base=0x72496fe77000 file+0x3a0986\n             symbol=CFDateFormatterCreateStringWithAbsoluteTime\
    \ + 0xd6\n  CORE-INSN 48 8b 78 10  (movq 0x10(%rax),%rdi; rax NULL, si_addr 0x10)\n    #0 CFDateFormatterCreateStringWithDate\
    \ + 0x75 (CoreFoundation)\n    #1 -[NSDateFormatter stringFromDate:] + 0x24a (Foundation, vm 0x1cb4a)\n\
    \    #2 __33-[Xcode3CommandLineBuildTool ...] (Xcode3Core, saveResultBundleForError:triage)\n  XCB_RC=139\n\
    \nTHE NULL, NAMED FROM THE INSTRUCTION AND THE PROBE (not inferred). The deployed CoreFoundation's\n\
    _CFDateFormatterCreateStringWithAbsoluteTime (0x678b0) saves its SECOND ARGUMENT (rsi, the\nformatter)\
    \ to -0x628(%rbp) at 0x678d0 and loads it back at 0x6797f; 0x67986 is `movq 0x10(%rax),\n%rdi`, and\
    \ struct __CFDateFormatter (CFDateFormatter.c:217-219) is CFRuntimeBase then UDateFormat\n*_df, so\
    \ 0x10 is _df and si_addr 0x10 means %rax == formatter == NULL: the FORMATTER OBJECT\nitself, not\
    \ its _df. tests/dateformatter_guest.c measures the cause in one process on the\ndeployed runtime:\
    \ CFDateFormatterCreate (the call -[NSDateFormatter _regenerateFormatter] makes)\nreturns NULL because\
    \ ICU's udat_open returns NULL with status 7 for EVERY locale\n(\"en_US\", \"en\", \"root\", \"\"\
    ), because /usr/share/icu/icudt66l.dat is ABSENT.\n\nTHE FIX. ICU is compiled with -DICU_DATA_DIR=\"\
    /usr/share/icu/\"\n(darling/src/external/icu/icuSources/CMakeLists.txt:20) and its CMake install ships\
    \ icudt66l.dat\nto libexec/darling/usr/share/icu, but libicucore.A.dylib alone resolves, so the loader\
    \ never\nnamed the gap and nothing in the deploy list carried the data file. The patch adds ICU's\
    \ own\nCMake install target to scripts/ios-toolchain-runtime-additions.sh -- the declared runtime\n\
    additions for this lane, each already installed through its owner's install target -- so the\ndata\
    \ file is installed with the dylib. No CoreFoundation or Foundation source change: both\nconstructed\
    \ and reported the failure correctly, and Apple's contract for\nCFDateFormatterCreateStringWithAbsoluteTime\
    \ requires a valid formatter (the formatter's _df is\ndereferenced unconditionally), so a nil check\
    \ there would convert a real defect into silent\nwrong output.\n\nRED, RUN RAW (the declared red-proof\
    \ cannot be SELECTED on this prefix: the whole-profile\napplicability plan is evaluated before --test\
    \ selects a row and needs the guest CLT this prefix\nlacks -- so the arms below are raw, on the deployed\
    \ runtime, exactly as the previous rungs'\nwere). Fixture sha256 3927715b52b49b516b5a663d300191334683e19696208021cddf2530942661e2\n\
    (tests/dateformatter_guest.c), driver sha256 cf5919d3614e9a4a25a1c02413fe93ffebc302cfb379e49f85f6fb43d2be1054.\n\
    RED (deployed icudt66l.dat removed, everything else untouched):\n\n  DF-ICUDATA path=\"/usr/share/icu/icudt66l.dat\"\
    \ readable=0 size=-1\n  DF-UOPEN locale=\"en_US\" dateStyle=MEDIUM timeStyle=NONE ptr=0x0 status=7\n\
    \  DF-CREATE locale=currentLocale dateStyle=MEDIUM timeStyle=MEDIUM ptr=0x0\n  DF-CHECK name=cfdateformatter-create-current\
    \ ok=0 locale=currentLocale medium/medium\n  [sigexc-fatal sig=11 code=1 addr=0x10 pid=1678239 tid=1678239]\n\
    \  DF_RUN_RC=139\n\nGREEN (same fixture bytes, ICU data installed through ICU's own CMake install\
    \ target):\n\n  DF-ICUDATA path=\"/usr/share/icu/icudt66l.dat\" readable=1 size=29074368\n  DF-CREATE\
    \ locale=currentLocale dateStyle=MEDIUM timeStyle=MEDIUM ptr=0x7b9762b29690\n  DF-STRING formatter=0x7b9762b325c0\
    \ date=0x7b9762b37340 string=0x7b9762b3d6f0 value=\"2021 M06 15 12:00:00\"\n  DF-CHECK name=stringFromDate-non-null\
    \ ok=1\n  DF-CHECK name=stringFromDate-non-empty ok=1\n  DF-CHECK name=stringFromDate-has-year ok=1\n\
    \  DF-CHECK name=stringFromDate-has-time ok=1\n  DF_VERDICT=GREEN\n\nDeployed sha256 after the fix:\
    \ CoreFoundation 4642b1cb... (BOTH copies, unchanged),\nFoundation a1e64e67... (BOTH copies, unchanged),\
    \ libicucore.A.dylib fe5f98bb... (BOTH copies),\nlibexec/darling/usr/share/icu/icudt66l.dat 6b6a6faf4630a9ba0703a5da8ba28905edd3dd5dc790c98126a220e2d549367b,\n\
    dyld 18213c31... (BOTH copies, unchanged).\n\nWHAT IT DOES NOT COVER. The ladder then reaches the\
    \ NEXT wall, still in the same error-printing\npath and still keeping the build error out of the stream:\
    \ -[NSFileManager temporaryDirectory]\n(Apple's NSFileManager.h:462 declares it) is absent from this\
    \ tree's Foundation, and\n-[Xcode3CommandLineBuildTool resolveErrorTriageResultBundleDestination]\
    \ sends it. From the\nworkloads' own streams (both workloads, /private/var/tmp/xcodebuild-{minproj,iosapp}.out)\
    \ and\nfrom scripts/dwdiag core on the cores they left (/tmp/t4cores/core.1694958):\n\n  ** INTERNAL\
    \ ERROR: Uncaught exception **\n  Uncaught Exception: -[NSFileManager temporaryDirectory]: unrecognized\
    \ selector sent to instance 0x787d62c08390\n  Stack:\n    4   -[NSObject(NSObject) doesNotRecognizeSelector:]\
    \ (in CoreFoundation)\n    7   -[Xcode3CommandLineBuildTool resolveErrorTriageResultBundleDestination]\
    \ (in Xcode3Core)\n    8   -[Xcode3CommandLineBuildTool saveResultBundleForError:triageWithSchemeTask:error:]\
    \ (in Xcode3Core)\n   10   -[Xcode3CommandLineBuildTool _printErrorString:andFailWithCode:] (in Xcode3Core)\n\
    \  [sigexc-fatal sig=4 code=2 addr=0x787D662C347F pid=1694958 tid=1694958]\n  XCB_RC=132\n  CORE-FAULT\
    \ image=.../libsystem_c.dylib symbol=__abort + 0x15f  CORE-INSN ud2\n  CORE-STACK #1 _Xcode3CommandLineToolHandleException\
    \ (Xcode3Core) #3 _NSExceptionHandler (Foundation)\n             #4 _objc_terminate (libobjc) #14/#15\
    \ Xcode3CommandLineBuildTool (Xcode3Core)\n\nBoth workloads still report artifact=none, so the build\
    \ error remains hidden behind the next\nmissing Foundation API.\n"
  env: darling
