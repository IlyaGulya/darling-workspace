- id: xpc_sync_send_unconnected_guest
  module: darling/src/external/libxpc
  bead: dar-liaq
  name: xpc_sync_send_unconnected_guest
  kind: guest
  coverage-tier: runtime
  diag: bare
  runner: guest-c-fixture
  repo: darling-workspace
  script: tests/xpc_sync_send_unconnected_guest.c
  ok-marker: XPC_SYNC_SEND_UNCONNECTED_OK
  timeout-seconds: 300
  compile-flags:
  - -std=gnu11
  - -Wall
  - -Wextra
  - -Werror
  guest-cc: /Volumes/SystemRoot/home/ilyagulya/.darling/Library/Developer/CommandLineTools/usr/bin/clang
  guest-cflags: -isysroot /Volumes/SystemRoot/home/ilyagulya/.darling/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
  requires:
  - darling-prefix
  note: "Permanent guest oracle for the ladder's 30 s stall loop (bead dar-liaq). libxpc's\n-sendMessageWithSynchronousReply:\
    \ went straight to\ndispatch_mach_send_with_result_and_wait_for_reply without ever ensuring the connection\
    \ was\nactivated. While libdispatch still carries DISPATCH_MACH_NEVER_CONNECTED in\ndmsr_disconnect_cnt\
    \ (event_kevent.c:3077 sets it at creation; only dispatch_mach_connect,\nmach.c:286 -- reached only\
    \ from activateLocked, connection.m:803 <- activate <- resume --\nclears it), _dispatch_mach_send_push_and_trydrain\
    \ (mach.c:1623-1634) queues the message and\nreturns WITHOUT draining, so no request is sent, no reply\
    \ waiter is registered, and the\nreceive that follows cannot be woken: MACH_MSG_TIMEOUT_NONE and, because\
    \ dmsr_send is\nMACH_PORT_NULL, no MACH_RCV_SYNC_WAIT (mach.c:801-803, gated on MACH_PORT_VALID(send)).\n\
    MEASURED 2026-10-13 on prefix-verify14 (both xcodebuild workloads, 40 min, no artifact): the\nworkload's\
    \ main thread sat in exactly that receive for the whole run --\ndtape.ering tag=recv_park option=0x0700020E\
    \ = MACH_RCV_MSG|MACH_RCV_LARGE|\nMACH_RCV_LARGE_IDENTITY|MACH_MSG_STRICT_REPLY|MACH_RCV_TRAILER_ELEMENTS(7),\
    \ timeout=0, no\nMACH_RCV_SYNC_WAIT -- with NO request published on the ring for it, reached from\n\
    xpc_connection_send_message_with_reply_sync <- CoreSymbolicationDT <- DVTStackBacktrace <-\nIDEInitialize.\n\
    \nWHAT THE PATCH DOES. Activate first (idempotent; the connected case then keeps its bounded\nreceive,\
    \ MACH_RCV_SYNC_WAIT arms, and a peer that dies fails the receive) and return the\nconnection error\
    \ -- XPC_ERROR_CONNECTION_INTERRUPTED for a named service,\nXPC_ERROR_CONNECTION_INVALID otherwise,\
    \ the file's own existing convention -- instead of\nentering the unbounded receive when the channel\
    \ was never connected. No timeout is added to\n_dispatch_mach_msg_reply_recv: Apple's own libdispatch\
    \ marks this pre-connect phase\nincomplete (mach.c:1952, rdar://31823384) and Apple's libxpc connects\
    \ at creation, so the\nApple-shaped end state is a FAILED send, not a flaky one.\n\nWHO THE PEER IS,\
    \ AND WHY IT HAS NO RECEIVER HERE. The sync send is CoreSymbolicationDT's\nrequest to the mach service\
    \ com.apple.coresymbolicationd (the literal is in the deployed\nXcode 26.3 Contents/SharedFrameworks/CoreSymbolicationDT.framework).\
    \ Xcode's caller is not\nthe divergence: CSCppDaemonConnection's constructor creates that connection\
    \ and calls\nxpc_connection_resume (0xfcac5/0xfcad4 create_mach_service, 0xfcaf9 resume, 0xfccd4/0xfcce0\n\
    the synchronous send), so activation was ATTEMPTED and its bootstrap_look_up failure became\nthe park.\
    \ Darling's tree carries a coresymbolicationd stub and its LaunchDaemon plist\n(src/private-frameworks/CoreSymbolication/{src/daemon.c,resources/\n\
    com.apple.coresymbolicationd.plist}), and the boot chain would load\n/System/Library/LaunchDaemons (launchctl\
    \ bootstrap -S System -> system_specific_bootstrap ->\nload -D all -> glob, launchctl.c:2291/2477/2704)\
    \ -- but the deployed prefix has NEITHER the\ndaemon nor the plist, and the fixture measures the lookup\
    \ itself: `lookup\nname=com.apple.coresymbolicationd kr=1105` (1105 = BOOTSTRAP_NO_MEMORY; launchd's\n\
    job_mig_look_up2 returns it only on its `if (!j) return BOOTSTRAP_NO_MEMORY` and\njob_mig_lookup_per_user_context\
    \ has the same guard, so the code is recorded raw rather than\ninterpreted). Providing that peer is\
    \ additive work with its own deploy plumbing; this patch\nis the half that makes a missing peer a failed\
    \ send instead of an infinite park.\n\nRED/GREEN ARMS (raw, on prefix-verify14 with the declared guest-cc/guest-cflags,\
    \ driven by\ntestkit/scripts/run-darling-c-test.sh --name xpcunconn; the same fixture bytes in both):\n\
    \  RED   pre-fix runtime, libxpc 5ff653b9... in both copies (restored from the deploy\n        transaction\
    \ backup, i.e. the known-bad runtime bytes):\n        evidence/xpc-sync-send-unconnected/red-arm-pre-fix.log\
    \ -- the last line is\n        `XPCUNCONN step=send_sync_never_resumed_begin`, the guest shell is killed\
    \ after the\n        guest timeout, WEST_TEST_FAILURE_PHASE=run, and no `..._returned` line exists.\n\
    \  GREEN fixed runtime, libxpc 14be67e6... in BOTH copies (proved by\n        scripts/darling-deploy-verify.sh\
    \ --component libxpc, every copy ok):\n        evidence/xpc-sync-send-unconnected/green-arm-post-fix.log\
    \ -- both subjects return an\n        error object (`never_resumed returned=1 type=error`,\n       \
    \ `resumed_missing_service returned=1 type=error`, `Connection interrupted`), the\n        mach_msg\
    \ round-trip control delivers, and the fixture prints\n        XPC_SYNC_SEND_UNCONNECTED_OK.\nThe harness\
    \ RED arm cannot be selected on this prefix today, the same pre-existing\nenvironment limit the sibling\
    \ entries record (the whole-profile applicability plan is\nevaluated before --prove-red can select a\
    \ row, and this prefix carries no guest\nCommandLineTools at the fixture runner's default path\n/Library/Developer/CommandLineTools/usr/bin/clang);\
    \ the raw arms above are run with the\ndeclared guest-cc/guest-cflags instead.\n"
  env: darling
