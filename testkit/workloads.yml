- id: kern_proc_pid_sysctl_guest
  module: darling/src/external/xnu
  bead: dar-liaq
  name: kern_proc_pid_sysctl_guest
  kind: guest
  coverage-tier: runtime
  diag: bare
  runner: guest-c-fixture
  repo: darling-workspace
  script: tests/kern_proc_pid_sysctl_guest.c
  ok-marker: KERN_PROC_PID_SYSCTL_OK
  timeout-seconds: 60
  compile-flags:
  - -std=gnu11
  - -Wall
  - -Wextra
  - -Werror
  requires:
  - darling-prefix
  note: 'Guest runtime proof for the KERN_PROC_PID query DVTFoundation''s

    CurrentProcessIsBeingDebugged() makes. The emulation read "/proc" through

    the vchroot guest path, and a rootless prefix has no procfs there

    (darlingserver mounts one only for its non-rootless PID namespace), so

    sysctl(CTL_KERN, KERN_PROC, KERN_PROC_PID, getpid()) returned ENOENT --

    MEASURED on a rootless prefix: rc=-1 errno=2 while getpid() was 475721, a

    host pid, so no pid translation is involved. DVTFoundation turns the

    non-zero return into a soft assertion whose handler re-enters the

    once-guarded -[DVTToolsInfo runtimeInternalState] and trips libdispatch''s

    deliberate ud2 ("trying to lock recursively"), the Xcode ladder''s wall.

    The fixture reads the process''s own procfs with raw Linux syscalls and

    asserts the self query succeeds with a matching kp_proc.p_pid and no

    P_TRACED, while a pid that cannot exist still yields no record.

    '
  env: darling
- id: empty_collection_singleton_release_guest
  module: darling/src/external/corefoundation
  bead: dar-liaq
  name: empty_collection_singleton_release_guest
  kind: guest
  coverage-tier: runtime
  diag: bare
  runner: guest-c-fixture
  repo: darling-workspace
  script: tests/empty_collection_singleton_release_guest.c
  ok-marker: EMPTY_SINGLETON_RELEASE_OK
  timeout-seconds: 300
  compile-flags:
  - -std=gnu11
  - -Wall
  - -Wextra
  - -Werror
  guest-cc: /Volumes/SystemRoot/home/ilyagulya/work/local-target/xcode-26.3/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang
  guest-cflags: -isysroot /Volumes/SystemRoot/home/ilyagulya/work/local-target/xcode-26.3/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
  guest-env-vars:
    MallocDebugReport: stderr
  requires:
  - darling-prefix
  note: 'Guest runtime proof that the empty-collection singletons in CoreFoundation''s

    static storage survive being released.  MEASURED on the unfixed runtime (the

    patch''s parent, deployed on prefix-verify14): _objc_release(__NSArray0__) --

    exactly the call Xcode3Core''s -[Xcode3CommandLineBuildTool

    _resolvePackageDependenciesAndExit] block makes (return address

    Xcode3Core+0x3af97, _objc_release at libobjc+0x6a00) -- drives the isa retain

    count to zero and the ObjC runtime frees the storage with the guest''s free():

    "malloc: *** error for object 0x74558da824b8: pointer being freed was not

    allocated", the same abort the ladder takes on 0x7b65ca1d84b8 =

    ___NSArray0__struct.  The fixture also pins the two neighbours: the

    -release message path (same failure), an NSConstantArray in the fixture''s own

    static data (the shape a compiler-emitted literal has; same failure), the

    empty dictionary''s singleton (SIGSEGV, because __NSCFDictionary''s -release

    routes to CFRelease, which re-dispatches -release for an object that is not a

    CF object), and a double free control that must still die in BOTH arms, so the

    fix cannot be "stop reporting invalid frees".  Each subject runs in its own

    child: a child that dies must not take the verdict with it.

    The guest compiler path is the workspace''s canonical Xcode toolchain

    (docs/environment.md), because the ladder prefix is not provisioned with the

    guest CommandLineTools the fixture runner defaults to.

    Reproduce by hand: copy the fixture and a driver into

    <prefix>/private/var/tmp, then run the driver through

    `$prefix/bin/darling shell /bin/bash --login -c ''/private/var/tmp/relprobe-run.sh''`.

    '
  env: darling
