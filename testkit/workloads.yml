  requires:
  - darling-prefix
  note: "Guest runtime proof for thread_get_special_reply_port, the call that killed BOTH\nxcodebuild workloads\
    \ of this ladder after the pid_for_task and corpse-map rungs\nwere fixed. MEASURED on prefix-verify14,\
    \ both workloads, on the runtime this\npatch's parent builds:\n\n  [rpc-socket-DENIED] pid=797268 tid=797268\
    \ call=thread_get_special_reply_port image=kernel delta=0x33D2D denied=1\n  [sigexc-fault-map 7aca9ac00000-7aca9ac84000\
    \ r-xp 00001000 fc:00 5400587 .../usr/lib/system/libdispatch.dylib]\n  [sigexc-fatal sig=4 code=2 addr=0x7ACA9AC35977\
    \ pid=797268 tid=797268]\n  XCB_RC=132\n\ndelta=0x33D2D resolves against the DEPLOYED libsystem_kernel\
    \ to\ndserver_rpc_thread_get_special_reply_port + 0x1d (the generated wrapper's up-front\ndserver_rpc_hooks_get_socket());\
    \ mach_driver_get_fd does not exist in the server\nbinary, so the denial is the guest's own retired\
    \ per-thread RPC socket refusing the\ntransport and the server never saw the call. The core (scripts/dwdiag\
    \ core) names\nthe caller and the death: `ud2` (0f 0b) at _dispatch_get_thread_reply_port + 0x107\n\
    in the deployed libdispatch.dylib, reached from _dispatch_mach_send_and_wait_for_reply\n<- dispatch_mach_send_with_result_and_wait_for_reply\
    \ <-\nxpc_connection_send_message_with_reply_sync <- CoreSymbolicationDT <-\nDVTStackBacktrace <- IDEInitialize.\
    \ libdispatch mints the thread's special reply port\nthere ONCE per thread (exactly one denial line\
    \ per run) and traps natively on a\nNULL/dead port, so MACH_PORT_NULL was the guest's death warrant\
    \ rather than a\ndegraded result.\n\nWHAT THE FIX DOES. The trap is mach_reply_port's SPECIAL half with\
    \ an identical wire\nshape (EMPTY request, single-uint32 port reply), so it takes the same lane its\
    \ twin\nalready uses: __dserver_ring_thread_get_special_reply_port() == gr_port_trap with\nthis callnum,\
    \ tried first by the impl; the callnum joins\nDSERVER_RING_C2S_OPCODES / DSERVER_RING_OP_CLASS / RING_GENERATED_SIMPLE.\
