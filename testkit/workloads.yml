- id: pid_for_task_plane_route_guest
  module: darling/src/external/xnu
  bead: dar-liaq
  name: pid_for_task_plane_route_guest
  kind: guest
  coverage-tier: runtime
  diag: bare
  runner: guest-c-fixture
  repo: darling-workspace
  script: tests/pid_for_task_plane_route_guest.c
  ok-marker: PID_FOR_TASK_PLANE_ROUTE_OK
  timeout-seconds: 300
  compile-flags:
  - -std=gnu11
  - -Wall
  - -Wextra
  - -Werror
  guest-cc: /Volumes/SystemRoot/home/ilyagulya/.darling/Library/Developer/CommandLineTools/usr/bin/clang
  guest-cflags: -isysroot /Volumes/SystemRoot/home/ilyagulya/.darling/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
  requires:
  - darling-prefix
  note: "Guest runtime proof for pid_for_task, the call that killed BOTH xcodebuild\nworkloads of this\
    \ ladder. MEASURED on the unfixed runtime (prefix-verify14,\nlibsystem_kernel 4091bcec..., dyld 61261ebe...,\
    \ darlingserver bce0d370...):\n\n  [rpc-socket-DENIED] pid=711889 tid=711889 call=pid_for_task image=kernel\
    \ delta=0x3B0A0 denied=1\n  pid_for_task failed (internally): -32\n  __simple_abort pid=711889 ra=0x7860A303E44E[sigexc-fatal\
    \ sig=6 ...]\n  ORACLE_RC=134\n\nand the core (scripts/dwdiag core) named the frames\n__simple_abort\
    \ + 0x33 <- pid_for_task_impl + 0x3e <- _darling_mach_syscall + 0x39.\ndelta=0x3B0A0 resolves against\
    \ the DEPLOYED libsystem_kernel to\n`dserver_rpc_pid_for_task + 0x20` (the generated wrapper's up-front\n\
    dserver_rpc_hooks_get_socket()); mach_driver_get_fd does not exist in the\nserver binary, so the denial\
    \ is the guest's own retired per-thread RPC\nsocket refusing the transport and the server never saw\
    \ the call. The call\nhad NO ring route and NO plane op; the server-side handler already existed.\n\
    \nRED is therefore the abort plus the denied-call line, and GREEN is the\nfixture's own contract:\
    \ pid_for_task(own task port) returns KERN_SUCCESS and\ngetpid(); the port is a live SEND right (mach_port_type);\
    \ MACH_PORT_NULL and\nan unbacked name return KERN_FAILURE (5) with the process still alive to\nprint\
    \ its verdict; and a CHILD asking the same question gets its OWN pid.\n\nTHE HARNESS RED ARM CANNOT\
    \ RUN ON THIS PREFIX TODAY, the same pre-existing\nenvironment limit the sibling corefoundation/url-path-allowed-character-set\n\
    entry records: the whole-profile applicability plan is evaluated before\n--prove-red can select a\
    \ row, and this prefix carries no guest\nCommandLineTools at the fixture runner's default path\n(/Library/Developer/CommandLineTools/usr/bin/clang).\
    \ Both raw arms were\ntherefore run on prefix-verify14 with the declared guest-cc/guest-cflags and\n\
    are stored verbatim:\n  RED   unfixed runtime (the shas above), scripts/darling-boot-run.sh-free\n\
    \        driver testkit/scripts/run-darling-c-test.sh --name pdtprobe:\n        evidence/pid-for-task-plane-route/red-arm.log\n\
    \  GREEN fixed runtime (libsystem_kernel c714eaa9..., dyld 116ddecc...,\n        darlingserver 9c86f44b...),\
    \ same driver:\n        evidence/pid-for-task-plane-route/green-arm.log\nThe GREEN arm's line `PDTPROBE\
    \ own_task kr=0 pid=731533 expected=731533`\nis the load-bearing assertion; `PDTPROBE null_name kr=5`\
    \ / `bogus_name kr=5`\nare the controls that must fail rather than die.\n"
  env: darling
- id: task_map_corpse_info_guest
  module: darling/src/external/darlingserver
  bead: dar-liaq
  name: task_map_corpse_info_guest
  kind: guest
  coverage-tier: runtime
  diag: bare
  runner: guest-c-fixture
  repo: darling-workspace
  script: tests/task_map_corpse_info_guest.c
  ok-marker: TASK_MAP_CORPSE_INFO_OK
  timeout-seconds: 120
  guest-cc: /Volumes/SystemRoot/home/ilyagulya/.darling/Library/Developer/CommandLineTools/usr/bin/clang
  guest-cflags: -isysroot /Volumes/SystemRoot/home/ilyagulya/.darling/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
  requires:
  - darling-prefix
  note: "Guest runtime proof for task_map_corpse_info_64, the call whose duct-tape\nentry point was `dtape_stub_unsafe()`\
    \ -- `dtape_stub_log(__FUNCTION__, -1,\n...)` followed by `abort()` (duct-tape/src/stubs.c:49-80).\
    \ The abort kills\nthe SERVER, so the guest never receives a kern_return_t: it blocks in the\nMach\
    \ trap and every other thread of the process loses the shared\nprocess-control page at the same instant.\n\
    \nTHIS IS THE WALL THAT STOPPED BOTH xcodebuild WORKLOADS, and the denied\ncheckin is its SYMPTOM,\
    \ not its cause. MEASURED on prefix-verify14\n(darlingserver 9c86f44b..., libsystem_kernel c714eaa9...,\
    \ dyld\n116ddecc...), the server's last record of the whole incarnation is the stub\nline for the\
    \ call\n\n  [P:747758(747758)][T:747758(747758)] 747758(747758):...: stub (unsafe): task_map_corpse_info_64\n\
    \nafter which the server writes NOTHING for the remaining ~300 s of the run.\nWith the plane's server\
    \ gone an earlier pthread_canceled publication\n(plane op 7, tid 747760) is never completed, `request_state`\
    \ stays PENDING,\nand the loader's NEXT thread-create checkin cannot claim the single\nmanagement\
    \ slot:\n\n  [checkin-republish] tid=747917 attempt=1 page=1 ready=1 req=0x1 rep=0x0 pub=0\n  [rpc-socket-DENIED]\
    \ pid=747758 tid=747917 call=checkin image=loader denied=1 (no per-thread transport)\n\nso the guest\
    \ aborts and then hangs to the harness timeout (XCB_RC=absent;\niosapp the same shape, pid=756555\
    \ tid=756773). The checkin therefore had a\ntransport all along -- page=1 ready=1 -- and no server\
    \ behind it; the\n`[dserver-CRASH ...]` the probe writes goes to the server's own fds 1/2,\nwhich\
    \ is why dserver.log alone cannot show the death.\n\nWHAT THE FIX DOES. XNU's own routine (xnu/osfmk/corpses/corpse.c:733)\
    \ opens\nwith `if (task == TASK_NULL || task_is_a_corpse_fork(task)) return\nKERN_INVALID_ARGUMENT;`\
    \ and `if (corpse_task == TASK_NULL ||\n!task_is_a_corpse(corpse_task) || ...) return KERN_INVALID_ARGUMENT;`.\
    \ No\nDarling task can carry TF_CORPSE (task_generate_corpse(), the only source\nof a corpse port,\
    \ is itself unimplemented), so XNU's answer is the exact\nanswer for every input this platform can\
    \ receive. The guards are reproduced\nverbatim; the 32-bit entry point became XNU's own narrowing\
    \ wrapper. REUSE\nCHECK: this tree's corpses/corpse.c is NOT in the darlingserver_duct_tape\nsource\
    \ list and needs the kcdata/VM-kernel machinery the build omits;\nupstream duct-tape and VibeDarling's\
    \ fork carry the identical unsafe stub\nand also omit corpse.c.\n\nRED is the fixture stopping at\
    \ the call with the server's crash line in the\nsame stream; GREEN is map64/map32 both answering KERN_INVALID_ARGUMENT\
    \ (4)\nwith a thread CREATE+JOIN working both BEFORE and AFTER the call.\nTHE HARNESS RED ARM CANNOT\
    \ RUN ON THIS PREFIX TODAY, the same pre-existing\nenvironment limit the sibling pid_for_task and\n\
    corefoundation/url-path-allowed-character-set entries record (the\nwhole-profile applicability plan\
    \ is evaluated before --prove-red can select\na row, and this prefix carries no guest CommandLineTools\
    \ at the fixture\nrunner's default path). Both raw arms were therefore run on prefix-verify14\nwith\
    \ the declared guest-cc/guest-cflags and the supported driver,\ntestkit/scripts/run-darling-c-test.sh\
    \ --name corpseinfo, and are stored\nverbatim:\n  RED   unfixed runtime (darlingserver 9c86f44b...,\
    \ its sha in the crash\n        record): evidence/task-map-corpse-info-route/red-arm.log\n  GREEN\
    \ fixed runtime (darlingserver 69afd4c2...):\n        evidence/task-map-corpse-info-route/green-arm.log\n"
  env: darling
