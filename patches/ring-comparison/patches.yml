version: 1
description: Local matched ring OFF/ON composition preserving corrected residual runtime.
base-profile: wget-residual
patches:
  - path: xnu/ring-comparison-guest.patch
    module: darling/src/external/xnu
    source-branch: fix/ring-comparison-guest
    source-base: 9736367393c97fdb3cd3d393f15cc922744a9c5a
    source-commit: 0360502b50a30555dfadb31a1a0001c89e27fc8c
    bead: dar-gwn.7.7.1
    publication-status: blocked
    publication-blocker: Experimental common ring composition under dar-gwn.7.7; matched OFF/ON runtime acceptance and architecture review are required. No publication authorized.
    tests:
      - name: ring_completion_outcomes_host
        kind: contract
        coverage-tier: host
        runs: host
        diag: bare
        runner: source-profile-script
        requires-profile: ring-comparison
        source-env: RING_COMPLETION_PROFILE_ROOT
        script: darling/tests/ring-completion/run.py
        timeout-seconds: 120
        red: true
        red-proof:
          mode: source-base
          source-revision: bc21f8cab9b50e5e032f336298435a2f235e34cc
          source-env: RING_COMPLETION_SOURCE_ROOT
          expect-output-contains:
            - RING_COMPLETION_PUBLISHED_FAILURE_REPLAYED
      - name: ring_mach_ops_guest
        kind: guest
        coverage-tier: runtime
        runs: guest
        diag: guarded
        runner: guest-c-fixture
        repo: darling-workspace
        script: tests/shmem_ring_mach_ops_guest.c
        runtime-profile: homebrew-ring-on
        compile-flags:
          - "-std=gnu11"
          - "-Wall"
          - "-Wextra"
          - "-Werror"
        ok-marker: WEST_SHMEM_RING_MACH_OPS_OK
        timeout-seconds: 120
        host-stat-deltas:
          - path: per_call.dserver_callnum_ring_attach.count
            min-delta: 1
          - path: ring_fast_hit
            min-delta: 1
    sha256sum: 862c5985e09200e952f6cd7d33f3743ce008ba40e2403d5631fac393f5c78ff6
  - path: darlingserver/ring-comparison-server.patch
    module: darling/src/external/darlingserver
    source-branch: fix/ring-comparison-server
    source-base: 75d0fee5c5c38ad66bf3771479390011c9781d62
    source-commit: 7dc5e9d2d7801111789466ad70b6993c7f8f0c96
    bead: dar-gwn.7.7.2
    publication-status: blocked
    publication-blocker: Experimental common ring composition under dar-gwn.7.7; matched OFF/ON runtime acceptance and architecture review are required. No publication authorized.
    tests:
      - name: ring_host_gates
        kind: contract
        coverage-tier: host
        runs: host
        diag: bare
        runner: script
        requires-profile: ring-comparison
        script: tests/run-ring-shm-validate.sh
        timeout-seconds: 900
      - name: ring_exec_completion_host
        kind: contract
        coverage-tier: host
        runs: host
        diag: bare
        runner: c-fixture
        requires-profile: ring-comparison
        script: tests/exec_completion_test.cpp
        source-files:
          - src/utility.cpp
        cc: c++
        include-dirs:
          - internal-include
        compile-flags:
          - "-std=c++17"
          - "-Wall"
          - "-Wextra"
          - "-Werror"
          - "-DNDEBUG"
        timeout-seconds: 60
      - name: ring_microthread_dispatch_model
        kind: contract
        coverage-tier: model
        runs: host
        diag: bare
        runner: c-fixture
        requires-profile: ring-comparison
        repo: darling-workspace
        script: tests/microthread_dispatch_contract.cpp
        source-env: DSERVER_SRC_ROOT
        cc: c++
        include-dirs:
          - internal-include
        compile-flags:
          - "-std=c++17"
          - "-Wall"
          - "-Wextra"
          - "-Werror"
        timeout-seconds: 60
    sha256sum: a19a490d15dace2d7514526fd50b3aebb4cf714472b14dfe98b958e743b64011
  - path: libmalloc/region-generation.patch
    module: darling/src/external/libmalloc
    source-branch: fix/malloc-region-generation
    source-base: a57991e2651226a675654bd96e5d9ab6bec288c5
    source-commit: 15f5405f735a2c0fa4bdd1d21b341bd4db123279
    bead: dar-gwn.7.7.4
    publication-status: blocked
    publication-blocker: Matched OFF/ON package acceptance remains required; original CPack crash attribution remains unproven.
    tests:
      - name: malloc_region_generation_native
        kind: guest
        coverage-tier: runtime
        runs: guest
        diag: guarded
        runner: guest-command-fixture
        guest-command: /usr/libexec/rack_region_generation
        runtime-profile: homebrew-ring-on
        expect:
          returncode: 0
          output-contains: [RACK_REGION_GENERATION_OK]
        timeout-seconds: 60
    sha256sum: 62ac80d7e59fc133343050c7ad5919447120bbc657c8773c5cc9b8b0d0f70852
