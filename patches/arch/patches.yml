  tests:
  - name: host_regression_ctest
    kind: contract
    coverage-tier: host
    runs: host
    diag: bare
    red: true
    red-proof:
      mode: source-base
      source-env: DARLING_SRC_ROOT
      note: The fixed profile provides the runner while the source-base tree lacks the standalone regression CMake entrypoint, so RED fails before CTest discovery and GREEN configures, builds, and runs all labeled host cases.
    runner: source-profile-script
    repo: darling
    script: tests/regression/run-host-regressions.sh
    timeout-seconds: 60
    note: >-
      Source-owned Tier 0 CTest suite builds the selected production mldr reset
