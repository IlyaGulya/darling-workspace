    runs: guest
    diag: guarded
    red: true
    red-proof:
      mode: guest-runtime-deploy
      bad-profile: current-minus-patch
      expect-output-contains:
      - ORACLE_RC=1
      - 'untimed wait observed stale timeout/error: 22'
      current-minus-skip-patches:
      - darlingserver/assert-wait-cancel-stale-timer.patch
