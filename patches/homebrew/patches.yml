    guest-cc: /Volumes/SystemRoot/home/ilyagulya/.darling/Library/Developer/CommandLineTools/usr/bin/clang
    guest-cflags: -isysroot /Volumes/SystemRoot/home/ilyagulya/.darling/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
    requires:
    - darling-prefix
    note: |
      Guest runtime proof for task_map_corpse_info_64, the call whose duct-tape
      entry point was `dtape_stub_unsafe()` -- `dtape_stub_log(__FUNCTION__, -1,
      ...)` followed by `abort()` (duct-tape/src/stubs.c:49-80). The abort kills
      the SERVER, so the guest never receives a kern_return_t: it blocks in the
      Mach trap and every other thread of the process loses the shared
      process-control page at the same instant.

      THIS IS THE WALL THAT STOPPED BOTH xcodebuild WORKLOADS, and the denied
      checkin is its SYMPTOM, not its cause. MEASURED on prefix-verify14
      (darlingserver 9c86f44b..., libsystem_kernel c714eaa9..., dyld
      116ddecc...), the server's last record of the whole incarnation is the stub
      line for the call

        [P:747758(747758)][T:747758(747758)] 747758(747758):...: stub (unsafe): task_map_corpse_info_64

      after which the server writes NOTHING for the remaining ~300 s of the run.
      With the plane's server gone an earlier pthread_canceled publication
      (plane op 7, tid 747760) is never completed, `request_state` stays PENDING,
      and the loader's NEXT thread-create checkin cannot claim the single
      management slot:

        [checkin-republish] tid=747917 attempt=1 page=1 ready=1 req=0x1 rep=0x0 pub=0
        [rpc-socket-DENIED] pid=747758 tid=747917 call=checkin image=loader denied=1 (no per-thread transport)

      so the guest aborts and then hangs to the harness timeout (XCB_RC=absent;
      iosapp the same shape, pid=756555 tid=756773). The checkin therefore had a
      transport all along -- page=1 ready=1 -- and no server behind it; the
      `[dserver-CRASH ...]` the probe writes goes to the server's own fds 1/2,
      which is why dserver.log alone cannot show the death.

      WHAT THE FIX DOES. XNU's own routine (xnu/osfmk/corpses/corpse.c:733) opens
      with `if (task == TASK_NULL || task_is_a_corpse_fork(task)) return
      KERN_INVALID_ARGUMENT;` and `if (corpse_task == TASK_NULL ||
      !task_is_a_corpse(corpse_task) || ...) return KERN_INVALID_ARGUMENT;`. No
      Darling task can carry TF_CORPSE (task_generate_corpse(), the only source
      of a corpse port, is itself unimplemented), so XNU's answer is the exact
      answer for every input this platform can receive. The guards are reproduced
      verbatim; the 32-bit entry point became XNU's own narrowing wrapper. REUSE
      CHECK: this tree's corpses/corpse.c is NOT in the darlingserver_duct_tape
      source list and needs the kcdata/VM-kernel machinery the build omits;
      upstream duct-tape and VibeDarling's fork carry the identical unsafe stub
      and also omit corpse.c.

      RED is the fixture stopping at the call with the server's crash line in the
      same stream; GREEN is map64/map32 both answering KERN_INVALID_ARGUMENT (4)
      with a thread CREATE+JOIN working both BEFORE and AFTER the call.
      THE HARNESS RED ARM CANNOT RUN ON THIS PREFIX TODAY, the same pre-existing
      environment limit the sibling pid_for_task and
      corefoundation/url-path-allowed-character-set entries record (the
      whole-profile applicability plan is evaluated before --prove-red can select
      a row, and this prefix carries no guest CommandLineTools at the fixture
      runner's default path). Both raw arms were therefore run on prefix-verify14
      with the declared guest-cc/guest-cflags and the supported driver,
      testkit/scripts/run-darling-c-test.sh --name corpseinfo, and are stored
      verbatim:
        RED   unfixed runtime (darlingserver 9c86f44b..., its sha in the crash
              record): evidence/task-map-corpse-info-route/red-arm.log
        GREEN fixed runtime (darlingserver 69afd4c2...):
              evidence/task-map-corpse-info-route/green-arm.log
