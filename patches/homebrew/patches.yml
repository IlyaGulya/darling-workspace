version: 1
description: Clean upstreamable fixes used by the local Homebrew-capable Darling build.
integration-date: '2026-06-11T00:00:00Z'
test-profiles:
  darlingserver-cpp-compile-source-red:
    kind: contract
    coverage-tier: compile
    runs: host
    diag: bare
    red: true
    red-proof: source
    runner: c-fixture
    repo: darling-workspace
    cc: c++
    include-dirs:
    - internal-include
    compile-flags:
    - -std=c++17
    - -Wall
    - -Wextra
    - -Werror
  darling-cmake-target-source-red:
    kind: contract
    coverage-tier: host
    runs: host
    diag: bare
    red: true
    red-proof: source
    runner: darling-cmake-target-fixture
    requires-profile: homebrew
    timeout-seconds: 240
  eunion-guest-c-runtime:
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: bare
    runner: guest-c-fixture
    repo: darling-workspace
    compile-flags:
    - -std=gnu11
    - -Wall
    - -Wextra
    - -Werror
fixture-profiles:
  eunion-overlay:
    kind: eunion-overlay
  rootless-no-mount:
    kind: rootless-no-mount
patches:
- path: darlingserver/psynch-cvwait-balanced.patch
  sha256sum: dd370441db17cff3884ead74f5061144936d7ac3d1d6c889641710a82a6c94ed
  module: darling/src/external/darlingserver
  source-branch: fix/psynch-cvwait-balanced
  source-commit: 0a1980bfc8cce7b24f86a300310eb72dab2e4141
  bead: dar-q95.1
  tests:
  - name: psynch_cvwait_sequence_contract
    kind: contract
    runs: host
    diag: bare
    red: true
    red-proof:
      mode: source-base
      source-env: DSERVER_SRC_ROOT
    runner: source-profile-script
    script: tests/psynch_cvwait_sequence_contract.sh
    note: Source-level RED->GREEN contract that balanced equal cvwait sequences are accepted and stale sequences still log context.
  - name: psynch_cvwait_balanced_guest
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: guarded
    runtime-profile: homebrew-rootless-no-mount
    red: true
    red-proof:
      mode: guest-runtime-deploy
      bad-profile: current-minus-patch
      expect-output-contains:
      - PSYNCH_CVWAIT_BALANCED_OLD_EQUAL_REJECTED errno=22
      - WEST_GUEST_SHELL_RC=1
      runtime-artifacts:
      - module: darling/src/external/darlingserver
        build-targets:
        - darlingserver
        deploy:
        - bin/darlingserver
    runner: guest-c-fixture
    repo: darling-workspace
    script: tests/psynch_cvwait_balanced_guest.c
    ok-marker: PSYNCH_CVWAIT_BALANCED_GUEST_OK
    timeout-seconds: 30
    requires:
    - darling-prefix
    note: >-
      Direct guest ABI proof for the equal-generation boundary. The bad
      darlingserver rejects csgen == lockseq with EINVAL; the fixed runtime
      enters the bounded wait and returns ETIMEDOUT.
  github:
    fork:
      repo: IlyaGulya/darlingserver
      base: preupstream/main
      state: local
    upstream:
      repo: darlinghq/darlingserver
      base: main
      state: local
- path: darlingserver/microthread-resume-race.patch
  sha256sum: c937102741fc500bddc1374a2b3b11da3397c60d2c31352a2762caa6f0b66e6a
  module: darling/src/external/darlingserver
  source-branch: fix/microthread-resume-race
  source-commit: a99d52248f437be96239a22c8ce5f58fbf32d221
  bead: dar-q95.8
  tests:
  - name: microthread_resume_race_contract
    kind: contract
    coverage-tier: model
    runs: host
    diag: bare
    red: true
    red-proof:
      mode: self
      why-self: >-
        The race is a state-transition ordering invariant. This fixture runs
        the old dropped-wake transition and the production helper against the
        same resume-before-suspend, duplicate-resume, late-stop, and lifecycle
        cases without relying on scheduler timing.
      expect-output-contains:
      - MICROTHREAD_OLD_MODEL_LOST_EARLY_RESUME
      - MICROTHREAD_RESUME_MODEL_OK
    runner: c-fixture
    repo: darling-workspace
    script: tests/microthread_resume_contract.cpp
    source-env: DSERVER_SRC_ROOT
    cc: c++
    include-dirs:
    - internal-include
    compile-flags:
    - -std=c++17
    - -Wall
    - -Wextra
    - -Werror
    note: Behavioral old-vs-production wake-epoch state-machine proof.
  - name: microthread_resume_before_suspend_guest
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: guarded
    runtime-profile: homebrew-rootless-no-mount
    runner: guest-c-fixture
    repo: darling-workspace
    script: tests/microthread_resume_before_suspend_guest.c
    ok-marker: MICROTHREAD_RESUME_BEFORE_SUSPEND_OK
    timeout-seconds: 15
    compile-flags:
    - -std=gnu11
    - -Wall
    - -Wextra
    - -Werror
    requires:
    - darling-prefix
    guest-env-vars:
      DSERVER_TEST_FAULT_FILE: /private/var/tmp/dserver-microthread-resume-before-suspend-fault
    host-temp-files:
    - env: DSERVER_TEST_FAULT_FILE
      prefix-relative-path: private/var/tmp/dserver-microthread-resume-before-suspend-fault
    host-trace-files:
    - env: DSERVER_TEST_TRACE_FILE
      prefix-relative-path: private/var/tmp/dserver-microthread-resume-before-suspend.trace
      contains:
      - test_fault.consume name=microthread.resume_before_suspend
      - microthread.dtape.resume_before_suspend
      - microthread.suspend.consume_pending_resume
    note: >-
      Guest runtime proof for the resume-before-suspend lost wakeup: a guest
      thread enters self thread_suspend while a guarded duct-tape diagnostic
      simulates the matching thread_resume before the microthread physically
      suspends. Fixed darlingserver records the early resume permit and returns
      from thread_suspend; bad current-minus runtime drops the wake and the
      guest fixture times out.
  github:
    fork:
      repo: IlyaGulya/darlingserver
      base: preupstream/main
      state: local
    upstream:
      repo: darlinghq/darlingserver
      base: main
      state: local
