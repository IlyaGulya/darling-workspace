    guest-cflags: -isysroot /Volumes/SystemRoot/home/ilyagulya/.darling/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
    requires:
    - darling-prefix
    note: |
      Guest runtime proof for thread_get_special_reply_port, the call that killed BOTH
      xcodebuild workloads of this ladder after the pid_for_task and corpse-map rungs
      were fixed. MEASURED on prefix-verify14, both workloads, on the runtime this
      patch's parent builds:

        [rpc-socket-DENIED] pid=797268 tid=797268 call=thread_get_special_reply_port image=kernel delta=0x33D2D denied=1
        [sigexc-fault-map 7aca9ac00000-7aca9ac84000 r-xp 00001000 fc:00 5400587 .../usr/lib/system/libdispatch.dylib]
        [sigexc-fatal sig=4 code=2 addr=0x7ACA9AC35977 pid=797268 tid=797268]
        XCB_RC=132

      delta=0x33D2D resolves against the DEPLOYED libsystem_kernel to
      dserver_rpc_thread_get_special_reply_port + 0x1d (the generated wrapper's up-front
      dserver_rpc_hooks_get_socket()); mach_driver_get_fd does not exist in the server
      binary, so the denial is the guest's own retired per-thread RPC socket refusing the
      transport and the server never saw the call. The core (scripts/dwdiag core) names
      the caller and the death: `ud2` (0f 0b) at _dispatch_get_thread_reply_port + 0x107
      in the deployed libdispatch.dylib, reached from _dispatch_mach_send_and_wait_for_reply
      <- dispatch_mach_send_with_result_and_wait_for_reply <-
      xpc_connection_send_message_with_reply_sync <- CoreSymbolicationDT <-
      DVTStackBacktrace <- IDEInitialize. libdispatch mints the thread's special reply port
      there ONCE per thread (exactly one denial line per run) and traps natively on a
      NULL/dead port, so MACH_PORT_NULL was the guest's death warrant rather than a
      degraded result.

      WHAT THE FIX DOES. The trap is mach_reply_port's SPECIAL half with an identical wire
      shape (EMPTY request, single-uint32 port reply), so it takes the same lane its twin
      already uses: __dserver_ring_thread_get_special_reply_port() == gr_port_trap with
      this callnum, tried first by the impl; the callnum joins
      DSERVER_RING_C2S_OPCODES / DSERVER_RING_OP_CLASS / RING_GENERATED_SIMPLE. The
      semantics are unchanged -- the server runs the ORDINARY
      Call::ThreadGetSpecialReplyPort -> dtape_thread_get_special_reply_port, which is what
      the datagram path used (directive section 15).

      GREEN is the fixture's own contract: both calls return a live port name (neither
      MACH_PORT_NULL nor MACH_PORT_DEAD) that mach_port_type reports as a SEND+RECEIVE
      right (type=0x30000), the twin control mach_reply_port() still works, and the process
      survives to print its verdict -- `SPRPROBE survived_controls=1 first_ok=1 second_ok=1`.
      RED is the same fixture on the current-minus-patch runtime: `SPRPROBE first port=0x0`
      with the denial line above, and the control still working, which is what rules out
      "the runtime is broken" as the explanation.

      THE HARNESS RED ARM CANNOT RUN ON THIS PREFIX TODAY, the same pre-existing
      environment limit the sibling pid_for_task and corefoundation entries record (the
      whole-profile applicability plan is evaluated before --prove-red can select a row, and
      this prefix carries no guest CommandLineTools at the fixture runner's default path
      /Library/Developer/CommandLineTools/usr/bin/clang). Both raw arms were therefore run
      on prefix-verify14 with the declared guest-cc/guest-cflags and the supported driver,
      testkit/scripts/run-darling-c-test.sh --name sprprobe, and are stored verbatim:
        RED   current-minus-patch runtime (libsystem_kernel 218f9b28..., dyld
              8052c221..., built from this patch's parents with this tree's other work in
              place): evidence/thread-get-special-reply-port-lane-route/red-arm2.log,
              fixture sha256 ad4a8457..., ORACLE_RC=1
        GREEN fixed runtime (libsystem_kernel 0383d9a8..., dyld 18213c31...,
              darlingserver 5236a9b4..., all copies verified by
              scripts/darling-deploy-verify.sh): evidence/thread-get-special-reply-port-lane-route/green-arm-final.log,
              same fixture sha256, ORACLE_RC=0
      The GREEN arm's load-bearing lines are the two `port_type kr=0 type=0x30000` readings;
      the RED arm's is `SPRPROBE first port=0x0` next to the `rpc-socket-DENIED` line.
  - name: sem_site_wait_attribution_oracle
    kind: contract
    runs: host
    diag: bare
    red: true
    red-proof:
      mode: self
      expect-output-contains: '(RED arm mis-attributed the wait to the workload as expected)'
      why-self: >-
        The oracle consumes a (run-log, workload-stream) pair and must NAME the stream that
        holds the 30 s semaphore wait. The RED arm feeds it the recorded mis-attribution
        (the workload's own stream carrying the timedwait line) and the script requires that
        verdict, so the bad case executes the same decision logic rather than matching source
        text, and no checkout mutation is needed. The GREEN arm feeds it the measured pair
        and requires the run log (launchd).
      note: RED arm supplies the mis-attributed pair and the script requires the `workload`
        answer; GREEN arm supplies the measured pair and requires `run-log`.
    runner: self-contract-script
    script: tests/regression/run-sem-site-attribution-oracle.sh
    note: |
      Permanent guard for the measurement error that cost this ladder several runs: the
      30-second semaphore wait was read from the PREFIX's run log and attributed to the
      WORKLOAD, because that is where the investigator expected the wall. Measured
      2026-10-13 (prefix-verify14, minproj, 40 min wall): the deployed DARLING_SEM_SITE_TRACE
      line

        SEM-SITE tcb=0x7CFD977FF6C0 op=timedwait a=0x903 b=0x1E
                 sym0=semaphore_timedwait_trap_impl sym1=_darling_mach_syscall
                 sym2=sys_semwait_signal sym3=_darling_bsd_syscall

      appears ONCE in the run log and ZERO times in the workload's own stream
      ($PREFIX/private/var/tmp/xcodebuild-minproj.out, the file the workload's fd 1/2 point
      at). The chain `sys_semwait_signal` <- `_darling_bsd_syscall` is the BSD
      `__semwait_signal` path, i.e. libc `nanosleep`, so `sec=30` there is a SLEEP, and the
      only 30-second sleep in the guest image is launchd's update thread
      (src/launchd/src/launchd.c:458-468 `sync(); sleep(launchd_sync_frequency)`, 30 at
      launchd.c:118) -- confirmed in the DEPLOYED /sbin/launchd, whose `_update_thread`
      (0x1000282c0) loads `_launchd_sync_frequency` (__data 0x10003e8f8 == 0x0000001e) and
      calls `_sleep`. The workload itself issues NO semaphore wait at all (its single
      SEM-SITE line is `op=signal a=0x0`, the benign pthread-exit convention).

      Consequence for the ladder's wall: the inference "the parked XPC reply depends on the
      30 s handshake" is REFUTED -- launchd's sleep(30) and the workload's own ~30 s step
      clock are independent (their phase drifts ~0.5 s over 30 cycles, so the periods
      differ). The oracle makes the attribution mechanical for the next reader.
- path: darling/libxpc-sync-send-refuses-unconnected.patch
  sha256sum: c7b7948dd849ae4422380211f2ce355314455b8ee832e2147f99e1412547d3c3
  module: darling/src/external/libxpc
  source-branch: fix/xpc-sync-send-refuses-unconnected
  source-base: a7bc346027c3433b79f13793f48ac44522c80f8c
  source-commit: d62a6b26040aa9e88f0d256359f83968e6e67c6a
  bead: dar-liaq
  tests:
  - name: xpc_sync_send_unconnected_guest
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: bare
    red: true
    red-proof:
      mode: guest-runtime-deploy
      bad-profile: current-minus-patch
      source-modules:
      - darling/src/external/libxpc
      runtime-artifacts:
      - module: darling/src/external/libxpc
        build-targets:
        - libxpc
        deploy:
        - usr/lib/system/libxpc.dylib
      expect-failure-phase:
      - run
      expect-output-contains:
      - 'XPCUNCONN step=send_sync_never_resumed_begin'
      expect-output-lacks:
      - 'XPCUNCONN step=send_sync_never_resumed_returned'
    runner: guest-c-fixture
    repo: darling-workspace
    script: tests/xpc_sync_send_unconnected_guest.c
    ok-marker: XPC_SYNC_SEND_UNCONNECTED_OK
    timeout-seconds: 300
    compile-flags:
    - -std=gnu11
    - -Wall
    - -Wextra
    - -Werror
    guest-cc: /Volumes/SystemRoot/home/ilyagulya/.darling/Library/Developer/CommandLineTools/usr/bin/clang
    guest-cflags: -isysroot /Volumes/SystemRoot/home/ilyagulya/.darling/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
    requires:
    - darling-prefix
    note: |
      Permanent guest oracle for the ladder's 30 s stall loop (bead dar-liaq). libxpc's
      -sendMessageWithSynchronousReply: went straight to
      dispatch_mach_send_with_result_and_wait_for_reply without ever ensuring the connection was
      activated. While libdispatch still carries DISPATCH_MACH_NEVER_CONNECTED in
      dmsr_disconnect_cnt (event_kevent.c:3077 sets it at creation; only dispatch_mach_connect,
      mach.c:286 -- reached only from activateLocked, connection.m:803 <- activate <- resume --
      clears it), _dispatch_mach_send_push_and_trydrain (mach.c:1623-1634) queues the message and
      returns WITHOUT draining, so no request is sent, no reply waiter is registered, and the
      receive that follows cannot be woken: MACH_MSG_TIMEOUT_NONE and, because dmsr_send is
      MACH_PORT_NULL, no MACH_RCV_SYNC_WAIT (mach.c:801-803, gated on MACH_PORT_VALID(send)).
      MEASURED 2026-10-13 on prefix-verify14 (both xcodebuild workloads, 40 min, no artifact): the
      workload's main thread sat in exactly that receive for the whole run --
      dtape.ering tag=recv_park option=0x0700020E = MACH_RCV_MSG|MACH_RCV_LARGE|
      MACH_RCV_LARGE_IDENTITY|MACH_MSG_STRICT_REPLY|MACH_RCV_TRAILER_ELEMENTS(7), timeout=0, no
      MACH_RCV_SYNC_WAIT -- with NO request published on the ring for it, reached from
      xpc_connection_send_message_with_reply_sync <- CoreSymbolicationDT <- DVTStackBacktrace <-
      IDEInitialize.

      WHAT THE PATCH DOES. Activate first (idempotent; the connected case then keeps its bounded
      receive, MACH_RCV_SYNC_WAIT arms, and a peer that dies fails the receive) and return the
      connection error -- XPC_ERROR_CONNECTION_INTERRUPTED for a named service,
      XPC_ERROR_CONNECTION_INVALID otherwise, the file's own existing convention -- instead of
      entering the unbounded receive when the channel was never connected. No timeout is added to
      _dispatch_mach_msg_reply_recv: Apple's own libdispatch marks this pre-connect phase
      incomplete (mach.c:1952, rdar://31823384) and Apple's libxpc connects at creation, so the
      Apple-shaped end state is a FAILED send, not a flaky one.

      WHO THE PEER IS, AND WHY IT HAS NO RECEIVER HERE. The sync send is CoreSymbolicationDT's
      request to the mach service com.apple.coresymbolicationd (the literal is in the deployed
      Xcode 26.3 Contents/SharedFrameworks/CoreSymbolicationDT.framework). Xcode's caller is not
      the divergence: CSCppDaemonConnection's constructor creates that connection and calls
      xpc_connection_resume (0xfcac5/0xfcad4 create_mach_service, 0xfcaf9 resume, 0xfccd4/0xfcce0
      the synchronous send), so activation was ATTEMPTED and its bootstrap_look_up failure became
      the park. Darling's tree carries a coresymbolicationd stub and its LaunchDaemon plist
      (src/private-frameworks/CoreSymbolication/{src/daemon.c,resources/
      com.apple.coresymbolicationd.plist}), and the boot chain would load
      /System/Library/LaunchDaemons (launchctl bootstrap -S System -> system_specific_bootstrap ->
      load -D all -> glob, launchctl.c:2291/2477/2704) -- but the deployed prefix has NEITHER the
      daemon nor the plist, and the fixture measures the lookup itself: `lookup
      name=com.apple.coresymbolicationd kr=1105` (1105 = BOOTSTRAP_NO_MEMORY; launchd's
      job_mig_look_up2 returns it only on its `if (!j) return BOOTSTRAP_NO_MEMORY` and
      job_mig_lookup_per_user_context has the same guard, so the code is recorded raw rather than
      interpreted). Providing that peer is additive work with its own deploy plumbing; this patch
      is the half that makes a missing peer a failed send instead of an infinite park.

      RED/GREEN ARMS (raw, on prefix-verify14 with the declared guest-cc/guest-cflags, driven by
      testkit/scripts/run-darling-c-test.sh --name xpcunconn; the same fixture bytes in both):
        RED   pre-fix runtime, libxpc 5ff653b9... in both copies (restored from the deploy
              transaction backup, i.e. the current-minus-patch bytes):
              evidence/xpc-sync-send-unconnected/red-arm-pre-fix.log -- the last line is
              `XPCUNCONN step=send_sync_never_resumed_begin`, the guest shell is killed after the
              guest timeout, WEST_TEST_FAILURE_PHASE=run, and no `..._returned` line exists.
        GREEN fixed runtime, libxpc 14be67e6... in BOTH copies (proved by
              scripts/darling-deploy-verify.sh --component libxpc, every copy ok):
              evidence/xpc-sync-send-unconnected/green-arm-post-fix.log -- both subjects return an
              error object (`never_resumed returned=1 type=error`,
              `resumed_missing_service returned=1 type=error`, `Connection interrupted`), the
              mach_msg round-trip control delivers, and the fixture prints
              XPC_SYNC_SEND_UNCONNECTED_OK.
      The harness RED arm cannot be selected on this prefix today, the same pre-existing
      environment limit the sibling entries record (the whole-profile applicability plan is
      evaluated before --prove-red can select a row, and this prefix carries no guest
      CommandLineTools at the fixture runner's default path
      /Library/Developer/CommandLineTools/usr/bin/clang); the raw arms above are run with the
      declared guest-cc/guest-cflags instead.
- path: corefoundation/dictionary-contents-of-url-error.patch
  sha256sum: 739a4f8ccf5d562ccefd5f1f702c32d8228456bad92dca79fa9a00c6aaeb6aaa
  module: darling/src/external/corefoundation
  source-branch: fix/constant-collection-immortality
  source-base: 429d7b282b1e035d1965ac4d2f6909eb22c4e959
  source-commit: 7b5e0ce1ac312f73157f4f0120dc24b97b399549
  bead: dar-liaq
  tests:
  - name: dictionary_contents_of_url_error_guest
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: bare
    red: true
    red-proof:
      mode: guest-runtime-deploy
      bad-profile: current-minus-patch
      runtime-artifacts:
      - module: darling/src/external/corefoundation
        build-targets:
        - CoreFoundation
        deploy:
        - System/Library/Frameworks/CoreFoundation.framework/Versions/A/CoreFoundation
        - libexec/darling/System/Library/Frameworks/CoreFoundation.framework/Versions/A/CoreFoundation
      - module: darling/src/external/foundation
        build-targets:
        - Foundation
        deploy:
        - System/Library/Frameworks/Foundation.framework/Versions/C/Foundation
        - libexec/darling/System/Library/Frameworks/Foundation.framework/Versions/C/Foundation
      expect-failure-phase:
      - run
      expect-output-contains:
      - DICTURL-MISMATCH absent-domain got=NSDictionaryErrorDomain/-1 want=NSCocoaErrorDomain/260
    runner: guest-c-fixture
    repo: darling-workspace
    script: tests/dictionary_contents_of_url_error_guest.c
    ok-marker: DICTURL_VERDICT=GREEN
    timeout-seconds: 300
    compile-flags:
    - -std=gnu11
    - -Wall
    - -Wextra
    - -Werror
    guest-cc: /Volumes/SystemRoot/home/ilyagulya/work/local-target/xcode-26.3/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang
    guest-cflags: -isysroot /Volumes/SystemRoot/home/ilyagulya/work/local-target/xcode-26.3/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
    requires:
    - darling-prefix
    note: |
      Permanent guest oracle for the ERROR CONTRACT of the plist readers
      +[NSDictionary dictionaryWithContentsOfURL:error:] /
      -[NSDictionary initWithContentsOfURL:error:]. The ladder's wall was
      +[DVTToolsVersion setCurrentBetaVersionFromPlistFile:] (DVTFoundation, called from
      IDEInitialize) reading Xcode's own Contents/Resources/BetaVersion.plist -- a file a release
      Xcode does not ship -- and dying on the answer:

        [MT] DVTAssertions: ASSERTION FAILURE in DVTFrameworks/DVTFoundation/DeveloperStructure/DVTToolsVersion.m:136
        Details:  Failed to read beta plist: Error Domain=NSDictionaryErrorDomain Code=-1 "The operation couldn\u2019t be completed. (NSDictionaryErrorDomain error -1.)"
        Method:   +setCurrentBetaVersionFromPlistFile:
        [sigexc-fatal sig=4 code=2 addr=0x7F6C6CC2C47F pid=1187874 tid=1187874]
        XCB_RC=132

      The caller is written to accept exactly that miss: the failure path of that method
      (DVTFoundation x86_64 slice 0x54945) sends -[NSError dvt_hasDomain:errorCode:] with
      NSCocoaErrorDomain and 260 (NSFileReadNoSuchFileError), then with 4 (NSFileNoSuchFileError),
      and takes the assertion only when neither matches. The reader answered with a domain that
      exists nowhere else in this tree, so the assertion fired and its handler's deliberate ud2
      killed both workloads.

      The oracle gates, in one process with no compile-time Foundation reference (dlopen +
      objc_msgSend + sel_registerName): (1) a path that does not exist -> nil plus
      NSCocoaErrorDomain/260 with NSUnderlyingError NSPOSIXErrorDomain/ENOENT -- the underlying
      pair is gated on purpose, because it is the errno of the open(2) that failed, so an error
      that merely spells "260" without having attempted the read does not pass; (2) a minimal
      plist the fixture writes itself must still parse (non-nil, count 2, the expected value) with
      NO error set, so the reader cannot pass by inventing an error on success; (3) when argv[1]
      names the ladder's own beta-plist path, the result must be a dictionary or exactly the
      domain/code pair the DVT caller tolerates. The parse-failure path (data readable, not a
      property list) is reported as DICTURL-NOTE parse-* and NOT gated: the fix under test leaves
