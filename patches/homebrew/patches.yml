- path: darlingserver/per-call-rpc-metrics.patch
  sha256sum: 491e95fb0024e62dd99e5b9a2e8f133b6e1548607539437598d15deb87ce7c9b
  module: darling/src/external/darlingserver
  source-branch: perf/per-call-rpc-metrics
  source-base: 496fe0259c42288bf21c6cb7e6d9340a67e32b29
  source-commit: 86cb8e34cc708eef1a26ae6a5287a00ef77aeca4
  bead: dar-dar6x4-perf-5dq.16
  tests:
  - name: per_call_metrics_contract
    kind: contract
    coverage-tier: compile
    runs: host
    diag: bare
    red: true
    red-proof:
      mode: source-base
      source-env: DSERVER_SRC_ROOT
    runner: c-fixture
    repo: darling/src/external/darlingserver
    script: tests/per_call_metrics_test.cpp
    cc: c++
    source-files:
    - src/metrics.cpp
    include-dirs:
    - include
    - internal-include
    generated-headers:
      darlingserver/rpc.h: |
        #pragma once
        #include <stdint.h>

        #ifdef __cplusplus
        extern "C" {
        #endif

        #define DSERVER_CALL_UNMANAGED_FLAG 0x80000000u

        typedef enum dserver_callnum {
        	dserver_callnum_invalid = 0,
        	dserver_callnum_checkin = 1,
        	dserver_callnum_mach_msg_overwrite = 2,
        	dserver_callnum_vchroot = 3,
        } dserver_callnum_t;

        static inline const char *dserver_callnum_to_string(dserver_callnum_t callnum) {
        	switch ((uint32_t)callnum & ~DSERVER_CALL_UNMANAGED_FLAG) {
        	case dserver_callnum_checkin:
        		return "checkin";
        	case dserver_callnum_mach_msg_overwrite:
        		return "mach_msg_overwrite";
        	case dserver_callnum_vchroot:
        		return "vchroot";
        	default:
        		return 0;
        	}
        }

        #ifdef __cplusplus
        }
        #endif
      darlingserver/rpc-supplement.h: |
        #pragma once
        #include <stdint.h>
        #define DSERVER_RING_CLASS_SIMPLE_C2S 0x1u
        #define DSERVER_RING_CLASS_NOFIBER_FAST 0x2u
        #define DSERVER_RING_CLASS_DESTROY 0x4u
        #define DSERVER_RING_CLASS_CALLER_S2C 0x8u
        static inline uint32_t dserver_ring_op_class(uint32_t callnum) {
        	(void)callnum;
        	return 0;
        }
    compile-flags:
    - -std=c++17
    - -w
    note: Host RED->GREEN compile contract that the real per_call_metrics_test.cpp links with production metrics.cpp and proves per-call counts, names, sparse output, and per-call latency are preserved.
