  source-base: 492a00f4929e5aba60607d9fed3e868bc4a3aeba
  source-commit: 72006d6a61504c5123b463f8369a8e09bc4b23cf
  bead: dar-7zvt.3
  tests:
  - name: mldr_main_tsd_contract
    kind: contract
    coverage-tier: host
    runs: host
    diag: bare
    red: true
    red-proof:
      mode: source-base
