- path: xnu/kern-proc-pid-sysctl.patch
  sha256sum: a363048f5db85ba79da5af608510ae651849139fe4bfae6beae6e368d530e1e5
  module: darling/src/external/xnu
  source-branch: fix/kern-proc-pid-sysctl
  source-base: 04434fe8d18ea689c704843608749d5608cb5abe
  source-commit: e1c70fc1ab8cf4275d70409c311fd51648f14137
  bead: dar-liaq
  tests:
  - name: kern_proc_pid_sysctl_guest
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: bare
    red: true
    red-proof:
      mode: guest-runtime-deploy
      bad-profile: current-minus-patch
      source-modules:
      - darling/src/external/darlingserver
      runtime-artifacts:
      - module: darling/src/external/xnu
        build-targets:
        - system_kernel
        deploy:
        - usr/lib/system/libsystem_kernel.dylib
      expect-output-contains:
      - KPPROBE-FAIL self KERN_PROC_PID returned non-zero
    runner: guest-c-fixture
    repo: darling-workspace
    script: tests/kern_proc_pid_sysctl_guest.c
    ok-marker: KERN_PROC_PID_SYSCTL_OK
    timeout-seconds: 60
    compile-flags:
    - -std=gnu11
    - -Wall
    - -Wextra
    - -Werror
    requires:
    - darling-prefix
    note: |
      Guest runtime proof for the KERN_PROC_PID query DVTFoundation's
      CurrentProcessIsBeingDebugged() makes. The emulation read "/proc" through
      the vchroot guest path, and a rootless prefix has no procfs there
      (darlingserver mounts one only for its non-rootless PID namespace), so
      sysctl(CTL_KERN, KERN_PROC, KERN_PROC_PID, getpid()) returned ENOENT --
      MEASURED on a rootless prefix: rc=-1 errno=2 while getpid() was 475721, a
      host pid, so no pid translation is involved. DVTFoundation turns the
      non-zero return into a soft assertion whose handler re-enters the
      once-guarded -[DVTToolsInfo runtimeInternalState] and trips libdispatch's
      deliberate ud2 ("trying to lock recursively"), the Xcode ladder's wall.
      The fixture reads the process's own procfs with raw Linux syscalls and
      asserts the self query succeeds with a matching kp_proc.p_pid and no
      P_TRACED, while a pid that cannot exist still yields no record.
- path: corefoundation/empty-collection-singletons.patch
  sha256sum: 645af8d0842d82443015b338f3ba0b234662a47ac10365b2ef7e7e0174b59732
  module: darling/src/external/corefoundation
  source-branch: fix/constant-collection-immortality
  source-base: 79352385a4de207357cd8eac7c40f16b30451960
  source-commit: 98156c8e22e2112ded63dfad4947148ad34043eb
  bead: dar-liaq
  note: |
    The static-storage empty-collection singletons, committed AS FOUND from this
    session's working tree (the deployed prefix already ran it): __NSArray0__struct
    and __NSDictionary0__struct must BE the objects, because clients bind
    __NSArray0__struct (DVTSystemPrerequisites imports it and dyld stops with
    "Symbol not found: ___NSArray0__struct" without it), so
    __CFSingletonInStaticStorage() constructs them in place, and the
    constant-collection classes NSConstantArray/NSConstantDictionary -- the
    classes Apple's CoreFoundation exports for compiler-emitted literals -- are
    defined for them and for client literals.  It is a separate patch because the
    next one is the fix under test and its RED arm has to be the runtime this
    state produces.
- path: corefoundation/constant-collection-immortality.patch
  sha256sum: d2a983a9870d4190ba8c28674362ff6d1b77865ac89199e7ff3447dd6d988930
  module: darling/src/external/corefoundation
  source-branch: fix/constant-collection-immortality
  source-base: 98156c8e22e2112ded63dfad4947148ad34043eb
  source-commit: 4d7086d8df2e3b017e0e7284831b424f42e68c36
  bead: dar-liaq
  tests:
  - name: empty_collection_singleton_release_guest
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: bare
    red: true
    red-proof:
      mode: guest-runtime-deploy
      bad-profile: current-minus-patch
      expect-failure-phase:
      - run
      runtime-artifacts:
      - module: darling/src/external/corefoundation
        build-targets:
        - CoreFoundation
        deploy:
        - System/Library/Frameworks/CoreFoundation.framework/Versions/A/CoreFoundation
        - libexec/darling/System/Library/Frameworks/CoreFoundation.framework/Versions/A/CoreFoundation
      expect-output-contains:
      - RELPROBE-DIED subject=array-singleton-objc_release
    runner: guest-c-fixture
    repo: darling-workspace
    script: tests/empty_collection_singleton_release_guest.c
    ok-marker: EMPTY_SINGLETON_RELEASE_OK
    timeout-seconds: 300
    compile-flags:
    - -std=gnu11
    - -Wall
    - -Wextra
    - -Werror
    guest-cc: /Volumes/SystemRoot/home/ilyagulya/work/local-target/xcode-26.3/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang
    guest-cflags: -isysroot /Volumes/SystemRoot/home/ilyagulya/work/local-target/xcode-26.3/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
    guest-env-vars:
      MallocDebugReport: stderr
    requires:
    - darling-prefix
    note: |
      Guest runtime proof that the empty-collection singletons in CoreFoundation's
      static storage survive being released.  MEASURED on the unfixed runtime (the
      patch's parent, deployed on prefix-verify14): _objc_release(__NSArray0__) --
      exactly the call Xcode3Core's -[Xcode3CommandLineBuildTool
      _resolvePackageDependenciesAndExit] block makes (return address
      Xcode3Core+0x3af97, _objc_release at libobjc+0x6a00) -- drives the isa retain
      count to zero and the ObjC runtime frees the storage with the guest's free():
      "malloc: *** error for object 0x74558da824b8: pointer being freed was not
      allocated", the same abort the ladder takes on 0x7b65ca1d84b8 =
      ___NSArray0__struct.  The fixture also pins the two neighbours: the
      -release message path (same failure), an NSConstantArray in the fixture's own
      static data (the shape a compiler-emitted literal has; same failure), the
      empty dictionary's singleton (SIGSEGV, because __NSCFDictionary's -release
      routes to CFRelease, which re-dispatches -release for an object that is not a
      CF object), and a double free control that must still die in BOTH arms, so the
      fix cannot be "stop reporting invalid frees".  Each subject runs in its own
      child: a child that dies must not take the verdict with it.
      The guest compiler path is the workspace's canonical Xcode toolchain
      (docs/environment.md), because the ladder prefix is not provisioned with the
      guest CommandLineTools the fixture runner defaults to.
      Reproduce by hand: copy the fixture and a driver into
      <prefix>/private/var/tmp, then run the driver through
      `$prefix/bin/darling shell /bin/bash --login -c '/private/var/tmp/relprobe-run.sh'`.
- path: corefoundation/url-path-allowed-character-set.patch
  sha256sum: c202146ecc568a529a4731322e5e3d338f21b4156498e03c8843115aea768c5c
  module: darling/src/external/corefoundation
  source-branch: fix/constant-collection-immortality
  source-base: 4d7086d8df2e3b017e0e7284831b424f42e68c36
  source-commit: 429d7b282b1e035d1965ac4d2f6909eb22c4e959
  bead: dar-liaq
  tests:
  - name: url_path_allowed_character_set_guest
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: bare
    red: true
    red-proof:
      mode: guest-runtime-deploy
      bad-profile: current-minus-patch
      runtime-artifacts:
      - module: darling/src/external/corefoundation
        build-targets:
        - CoreFoundation
        deploy:
        - System/Library/Frameworks/CoreFoundation.framework/Versions/A/CoreFoundation
        - libexec/darling/System/Library/Frameworks/CoreFoundation.framework/Versions/A/CoreFoundation
      expect-output-contains:
      - URLPathAllowedCharacterSet]: unrecognized selector
    runner: guest-c-fixture
    repo: darling-workspace
    script: tests/url_path_allowed_character_set_guest.c
    ok-marker: URLPATH_VERDICT=GREEN
    timeout-seconds: 300
    compile-flags:
    - -std=gnu11
    - -Wall
    - -Wextra
    - -Werror
    guest-cc: /Volumes/SystemRoot/home/ilyagulya/work/local-target/xcode-26.3/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang
    guest-cflags: -isysroot /Volumes/SystemRoot/home/ilyagulya/work/local-target/xcode-26.3/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
    requires:
    - darling-prefix
    note: |
      Guest runtime proof for +[NSCharacterSet URLPathAllowedCharacterSet], the
      accessor the Xcode ladder's DVTFoundation/DevToolsCore pair sends. MEASURED
      on the unfixed runtime (the patch's parent, deployed on prefix-verify14 as
      CoreFoundation 4afd5fdb... the prefix's guest-visible and libexec copies
      both ran it):

        Uncaught Exception: +[NSCharacterSet URLPathAllowedCharacterSet]: unrecognized selector sent to instance 0x7bd992a20360
        libc++abi: terminating with uncaught exception of type NSException
        URLPATH_RUN_RC=132

      which is exactly the line the ladder's own guest log carried before this fix
      (both workloads, /private/var/tmp/xcodebuild-{minproj,iosapp}.out, last
      real line before the rpc-socket-DENIED pid_for_task abort). The fix is
      CoreFoundation-only; the Foundation half of the rung is the matching header
      declaration in darling-foundation (NSCharacterSet.h), which the published
      SDK surface needs but which this fixture reaches through the runtime and
      therefore does not gate.

      The fixture measures the accessor's contract and the membership this tree
      defines: non-nil; two sends return the same object; the set is not mutated
      by a mutating message while a mutable copy of it IS (positive control); '/'
      '@' ':' '.' 'A' are members and ';' ' ' '?' '#' are not -- the membership is
      the tree's own kURLPathAllowedCharacters from the swift-corelibs-foundation
      submodule's CoreFoundation/URL.subproj/CFURLComponents_URIParser.c, which is
      also what Apple's CFURLComponents hands out. It also reports, as a NOTE and
      not a failure, that -[NSString
      stringByAddingPercentEncodingWithAllowedCharacters:] is still unimplemented:
      that is a separate API and out of this patch's scope.

      THE HARNESS RED ARM CANNOT RUN ON THIS PREFIX TODAY, and that is a
      pre-existing environment limit rather than this oracle's: `west test
      --profile homebrew --prefix <prefix> --prove-red --test
      empty_collection_singleton_release_guest` (the earlier oracle in this same
      file) stops at

        FATAL ERROR: darlingserver/psynch-cvwait-balanced.patch: missing required
        environment for psynch_cvwait_balanced_guest: guest compiler missing in
        prefix root: /Library/Developer/CommandLineTools/usr/bin/clang, ... ;
        bootstrap this prefix first: west test --prefix <prefix>
        --bootstrap-runtime-profile homebrew-guest-toolchain-provisioning

      because the whole-profile applicability plan is evaluated before --test
      selects a row. The declared RED arm is therefore a specification with its
      positive reason and its two deploy paths; the raw arms that WERE run are:
        RED   the parent CoreFoundation rebuilt from this working tree and
              deployed to both prefix copies
              (sha256 5c3e16fd59313ce38501371e2c15b71825b2ae79f86cc8ae88c9208fb5bfa3d1),
              fixture run through scripts/darling-boot-run.sh:
              evidence/urlpath-charset/red-arm-corrected.log
        GREEN the fixed CoreFoundation deployed to both copies
              (sha256 37ddd8b63da1c5804475cb4e68a897153455998aadd824c90142d76aa4755fc4),
              same driver: evidence/urlpath-charset/green-arm-final.log
      The guest compiler path is the workspace's canonical Xcode toolchain
      (docs/environment.md), because the ladder prefix is not provisioned with the
      guest CommandLineTools the fixture runner defaults to.
      Reproduce by hand: copy the fixture to <prefix>/private/var/tmp/urlpathprobe.c
      and a driver that runs the guest clang above into the same directory, then run
      the driver through
      `bash scripts/darling-boot-run.sh --prefix <prefix> --poll 'URLPATH_DRIVER_DONE=1'
      --marker 'URLPATH_DRIVER_DONE=1' --env DARLING_ROOTLESS=1 --env DARLING_NOOVERLAYFS=1
      --env DARLING_EUNION=1 --cmd '/bin/bash /private/var/tmp/urlpathprobe.sh'`.
- path: darlingserver/pid-for-task-plane-route.patch
  sha256sum: d8ce7aacdff80f49d70d3c989ac4cc244653881ec78dca104742eb8d8f6fc5f9
  module: darling/src/external/darlingserver
  source-branch: fix/pid-for-task-plane-route
  source-base: 15291c1519d05500720fb99a77afcd059b9f8661
  source-commit: c0dc8bb5abf6e0dd12f32da4f9d85f40e3867dc6
  bead: dar-liaq
  test-exception:
    reason: integration-runtime-provider
    scope: the server-side half of the pid_for_task process-management-plane route
    note: >-
      This patch appends plane op 37u and the server's transport adapter in front of the ALREADY EXISTING
      Call::PidForTask / duct-tape pid_for_task. A server-only minus-patch verdict is not meaningful: with
      the server half reverted but the guest half present the guest still publishes the request and the
      server answers -ENOSYS, and with the guest half reverted the guest aborts before it publishes anything
      at all. Both modules are reverted by the RED arm declared on the sibling xnu entry
      (red-proof.source-modules lists this module), and the same guest fixture is its GREEN arm.
- path: xnu/pid-for-task-plane-route.patch
  sha256sum: 7ab77d706c46b5c89ff90d29e00bebecf4b5c836e365f21ba0d92d943a0969e7
  module: darling/src/external/xnu
  source-branch: fix/pid-for-task-plane-route
  source-base: e1c70fc1ab8cf4275d70409c311fd51648f14137
  source-commit: ea5be4173879cbfd5cfe62dee20ec28e07024bc7
  bead: dar-liaq
  tests:
  - name: pid_for_task_plane_route_guest
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: bare
    red: true
    red-proof:
      mode: guest-runtime-deploy
      bad-profile: current-minus-patch
      source-modules:
      - darling/src/external/darlingserver
      runtime-artifacts:
      - module: darling/src/external/darlingserver
        build-targets:
        - darlingserver
        deploy:
        - bin/darlingserver
      - module: darling/src/external/xnu
        build-targets:
        - system_kernel
        deploy:
        - usr/lib/system/libsystem_kernel.dylib
      expect-output-contains:
      - 'call=pid_for_task image=kernel delta=0x3B0A0 denied=1'
      - 'pid_for_task failed (internally): -32'
    runner: guest-c-fixture
    repo: darling-workspace
    script: tests/pid_for_task_plane_route_guest.c
    ok-marker: PID_FOR_TASK_PLANE_ROUTE_OK
    timeout-seconds: 300
    compile-flags:
    - -std=gnu11
    - -Wall
    - -Wextra
    - -Werror
    guest-cc: /Volumes/SystemRoot/home/ilyagulya/.darling/Library/Developer/CommandLineTools/usr/bin/clang
    guest-cflags: -isysroot /Volumes/SystemRoot/home/ilyagulya/.darling/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
    requires:
    - darling-prefix
    note: |
      Guest runtime proof for pid_for_task, the call that killed BOTH xcodebuild
      workloads of this ladder. MEASURED on the unfixed runtime (prefix-verify14,
      libsystem_kernel 4091bcec..., dyld 61261ebe..., darlingserver bce0d370...):

        [rpc-socket-DENIED] pid=711889 tid=711889 call=pid_for_task image=kernel delta=0x3B0A0 denied=1
        pid_for_task failed (internally): -32
        __simple_abort pid=711889 ra=0x7860A303E44E[sigexc-fatal sig=6 ...]
        ORACLE_RC=134

      and the core (scripts/dwdiag core) named the frames
      __simple_abort + 0x33 <- pid_for_task_impl + 0x3e <- _darling_mach_syscall + 0x39.
      delta=0x3B0A0 resolves against the DEPLOYED libsystem_kernel to
      `dserver_rpc_pid_for_task + 0x20` (the generated wrapper's up-front
      dserver_rpc_hooks_get_socket()); mach_driver_get_fd does not exist in the
      server binary, so the denial is the guest's own retired per-thread RPC
      socket refusing the transport and the server never saw the call. The call
      had NO ring route and NO plane op; the server-side handler already existed.

      RED is therefore the abort plus the denied-call line, and GREEN is the
      fixture's own contract: pid_for_task(own task port) returns KERN_SUCCESS and
      getpid(); the port is a live SEND right (mach_port_type); MACH_PORT_NULL and
      an unbacked name return KERN_FAILURE (5) with the process still alive to
      print its verdict; and a CHILD asking the same question gets its OWN pid.

      THE HARNESS RED ARM CANNOT RUN ON THIS PREFIX TODAY, the same pre-existing
      environment limit the sibling corefoundation/url-path-allowed-character-set
      entry records: the whole-profile applicability plan is evaluated before
      --prove-red can select a row, and this prefix carries no guest
      CommandLineTools at the fixture runner's default path
      (/Library/Developer/CommandLineTools/usr/bin/clang). Both raw arms were
      therefore run on prefix-verify14 with the declared guest-cc/guest-cflags and
      are stored verbatim:
        RED   unfixed runtime (the shas above), scripts/darling-boot-run.sh-free
              driver testkit/scripts/run-darling-c-test.sh --name pdtprobe:
              evidence/pid-for-task-plane-route/red-arm.log
        GREEN fixed runtime (libsystem_kernel c714eaa9..., dyld 116ddecc...,
              darlingserver 9c86f44b...), same driver:
              evidence/pid-for-task-plane-route/green-arm.log
      The GREEN arm's line `PDTPROBE own_task kr=0 pid=731533 expected=731533`
      is the load-bearing assertion; `PDTPROBE null_name kr=5` / `bogus_name kr=5`
      are the controls that must fail rather than die.
