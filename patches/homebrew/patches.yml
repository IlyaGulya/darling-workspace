- path: darlingserver/vchroot-fdless-path-rpc.patch
  sha256sum: 7c5c9387ad5e875c1278a122265ed10f59bec7904fcad4db57ad7cdc00f07c16
  module: darling/src/external/darlingserver
  source-branch: fix/vchroot-fdless-path-rpc
  source-base: ce9c990df38ed6a97ee57ef6195eca982765cdf6
  source-commit: 614850a641f25d37410f7116619818f55eff539e
  bead: dar-gwn.7.7.5
  test-exception:
    reason: runtime-gate-pending
    scope: vchroot zero-descriptor-transport differential and pinned ordinary Docker
    note: The path-parameter ABI contract and the guest behavior are covered by the declared source contract and guest fixture; the remaining acceptance items are the descriptor-transport differential and the pinned Docker run, both owned by dar-gwn.7.7.5.
  tests:
  - name: vchroot_fdless_path_rpc_guest
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: guarded
    runtime-profile: homebrew-lz4-source
    red: true
    red-proof:
      mode: guest-runtime-deploy
      bad-profile: current-minus-patch
      current-minus-skip-patches:
      - xnu/vchroot-fdless-path-rpc.patch
      expect-output-contains:
      - VCHROOT_CLOSED_REJECTION_SITE=other
      - VCHROOT_CLOSED_FD rv=-9
      - WEST_DESCRIPTOR_TRACE_FAILURE window=vchroot-fdless-valid expected no descriptor-bearing message
      source-modules:
      - darling/src/external/darlingserver
      - darling/src/external/xnu
      runtime-artifacts:
      - module: darling/src/external/darlingserver
        build-targets:
        - darlingserver
        deploy:
        - bin/darlingserver
      - module: darling/src/external/xnu
        build-targets:
        - system_kernel
        deploy:
        - usr/lib/system/libsystem_kernel.dylib
    runner: guest-c-fixture
    repo: darling-workspace
    script: tests/vchroot_fdless_guest.c
    ok-marker: VCHROOT_FDLESS_PROBE_OK
    timeout-seconds: 300
    requires: [darling-prefix]
    descriptor-trace:
      windows:
      - id: console-open-control
        expect-descriptor-messages: at-least-one
      - id: vchroot-fdless-valid
        expect-descriptor-messages: none
    note: Same guest fixture as the xnu entry; here it proves the server side accepts the bounded path parameter for a valid descriptor and that the failed snapshot never reaches the server. The declared RED arm removes both halves of the fdless path RPC pair and expects the closed-descriptor leg to classify its rejection site as other - the pre-port runtime rejects that descriptor in the transfer or in the server (EBADF) instead of locally from the single readlink of /proc/self/fd/N. The descriptor-trace gate captures the launcher tree under strace and counts SCM_RIGHTS-bearing messages per declared window - the valid call's window must observe the call and transport no descriptor, while the console_open window in the same run must transport one - and the RED arm proves the same count is one on the pre-port runtime, which is the descriptor-transport differential.
  - name: vchroot_fdless_rpc_invariant_contract
    kind: source-contract
    coverage-tier: source
    runs: host
    diag: bare
    red: true
    red-proof:
      mode: source-base
      source-env: DSERVER_SRC_ROOT
      expect-output-contains:
      - VCHROOT_FDLESS_RPC_INVARIANT_FAILED
    runner: python
    repo: darling-workspace
    script: tests/vchroot_fdless_rpc_invariant_contract.py
    note: Source-contract audit asserting vchroot transports no descriptor in either direction while checkin, checkout, console_open, the debug_list_* calls and the kqchan_* calls keep theirs. This is not behavioral coverage; the zero-SCM_RIGHTS guest observable is the deferred runtime gate.
- path: darling/rootless-runtime-integration.patch
  sha256sum: cd78af09b7d034b126c09888ae7521abea071a25649c9691b6da0bbf53615443
  module: darling
