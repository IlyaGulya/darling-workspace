version: 1
description: Local wget residual fixes with explicit immutable source bundles and checked composition over homebrew; publication remains gated per patch.
base-profile: homebrew
test-profiles:
  spawn-cloexec-guest:
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: guarded
    runner: guest-c-fixture
    repo: darling-workspace
    script: tests/posix_spawn_cloexec_default_guest.c
    ok-marker: POSIX_SPAWN_CLOEXEC_DEFAULT_GUEST_OK
    timeout-seconds: 120
    requires:
    - darling-prefix
    compile-flags:
    - -std=gnu11
    - -D_DARWIN_C_SOURCE
    - -Wall
    - -Wextra
    - -Werror
  xnu-signal-runtime-proof:
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: guarded
    repo: darling-workspace
    red: true
    red-proof:
      mode: guest-runtime-deploy
      bad-profile: current-minus-patch
      expect-failure-phase: run
      cmake-defines:
        DARLING_EUNION: true
      source-modules:
      - darling
      - darling/src/external/darlingserver
      - darling/src/external/dyld
      runtime-artifacts:
      - module: darling/src/external/xnu
        build-targets: [system_kernel]
        deploy: [usr/lib/system/libsystem_kernel.dylib]
      - module: darling/src/external/dyld
        build-targets: [dyld]
        deploy: [usr/lib/dyld]
    timeout-seconds: 90
    requires: [darling-prefix]
    env-vars:
      DARLING_ROOTLESS: '1'
      DARLING_NOOVERLAYFS: '1'
      DARLING_EUNION: '1'
patches:
- path: darling/rootless-homebrew-coreservices.patch
  module: darling
  source-branch: fix/rootless-homebrew-coreservices
  source-base: 681329d6b6cb007e86316c572b138de88f1cfb8b
  source-commit: 23ccdeddaf85df02ef1c0e9570d2103308e21d2e
  bead: dar-gwn.7
  publication-status: blocked
  publication-blocker: Complete stock wget source-install acceptance and portable rootless closure coverage remain under dar-gwn.7.
  test-exception:
    reason: manual-runtime-regression
    scope: CoreServices loading was reproduced through unmodified libunistring test-alignasof and passed after closure deployment; the portable dynamic-loader regression belongs to dar-gwn.7.
  sha256sum: d620056b44fc4a2dee128ef8317621f9f1f93ed37b9a56f561f3c7ac245be3fa
- path: xnu/eunion-content-fd-validation.patch
  module: darling/src/external/xnu
  source-branch: fix/eunion-content-fd-validation
  source-base: 812e6e820009dde5f5af832233ebd120b7258fb6
  source-commit: f1575e01386ca9068626f9cd9ebc7d2872183b99
  bead: dar-gwn.7
  publication-status: blocked
  publication-blocker: Deployed guest regression and complete stock wget acceptance remain under dar-gwn.7.
  tests:
  - name: eunion_content_fd_validation
    kind: contract
    coverage-tier: host
    runs: host
    diag: bare
    red: true
    red-proof:
      mode: source-base
      source-env: XNU_SRC_ROOT
      expect-output-contains:
      - 'FAIL  FT negative descriptor reports EBADF'
      - 'FAIL  SP2 mkdir ignores lower symlink masked by upper directory'
    runner: source-contract-script
    repo: darling-workspace
    script: experiments/e-union/run.sh
    timeout-seconds: 60
    note: >-
      Execute the shared E-UNION harness once for both RED oracles: production
      ftruncate and E-UNION copy-up must report EBADF for a rejected descriptor
      without copying up or mutating LOWER, and production mkdirat with EUNION
      parent preparation must create in upper when an upper directory masks a
      lower symlink, without following or changing the masked lower alias.
      Declared once because this command is byte-identical to the removed
      eunion_upper_parent_dominance declaration, which west test skipped as a
      duplicate invocation and therefore never evaluated as its own oracle.
  - name: eunion_resolver
    kind: unit
    coverage-tier: host
    runs: host
    diag: bare
    ctest-label: eunion-host
    ctest-source-override: DARLING_XNU_SRC
    requires-profile: wget-residual
    note: CTest host behavior test compiling the production resolver against real upper/lower fixtures, whiteout and opaque metadata.
  - name: eunion_hardening_host_suite
    kind: unit
    coverage-tier: host
    runs: host
    diag: bare
    ctest-label: eunion-host
    ctest-source-override: DARLING_XNU_SRC
    red: true
    red-proof:
      mode: source-base
      source-env: XNU_SRC_ROOT
      source-revision: f033c5773992dfa57b6657f10f53f719664a5f18
      expect-output-contains:
      - 'FAIL  RESOLVE1 upper non-directory blocks lower directory'
    note: Host behavioral RED-to-GREEN suite for syscall-site copy-up, template protection, nested path handling, metadata/error policy and directory-view lifecycle; the selected XNU source is compiled and run through the eunion-host CTest label and the fixed source passes 293 assertions.
  - name: eunion_nested_lower_root_host_suite
    kind: unit
    coverage-tier: host
    runs: host
    diag: bare
    red: true
    red-proof:
      mode: source-base
      source-env: XNU_SRC_ROOT
      source-revision: f033c5773992dfa57b6657f10f53f719664a5f18
      expect-output-contains:
      - 'FAIL  RESOLVE1 upper non-directory blocks lower directory'
    runner: source-contract-script
    repo: darling-workspace
    script: experiments/e-union/run-nested-lower-root.sh
    note: Host behavior for nested lower-template roots and fd-path unexpand; the contract must run with materialize-profile because a final immutable source tip is one series boundary, not the cumulative canonical profile integration tree.
  sha256sum: 9ca0a7dd504aff7dd8d79a14fbb69a74bea1ad8975127bee716c8030c5fad69e
- path: darlingserver/preserve-wait-state-on-resume.patch
