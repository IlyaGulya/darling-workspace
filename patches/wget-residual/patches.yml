  bead: dar-gwn.7
  publication-status: blocked
  publication-blocker: Full guest acceptance and a portable waitq-enrollment regression remain under dar-gwn.7.
  test-exception:
    reason: manual-runtime-regression
    scope: The libunistring mutex stage reproduced a waitq double-enrollment panic and passed on the diagnostic runtime; a deterministic raw-lock-within-XNU-wait fixture belongs to dar-gwn.7.
  sha256sum: 0b9bc8985605d335be4c25088480dc5edc756a141ea340175617e48e24c4d82c
- path: darlingserver/microthread-dispatch-handoff.patch
