version: 1
description: Local wget residual fixes with explicit immutable source bundles and checked composition over homebrew; publication remains gated per patch.
base-profile: homebrew
test-profiles:
  spawn-cloexec-guest:
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: guarded
    runner: guest-c-fixture
    repo: darling-workspace
    script: tests/posix_spawn_cloexec_default_guest.c
    ok-marker: POSIX_SPAWN_CLOEXEC_DEFAULT_GUEST_OK
    timeout-seconds: 120
    requires:
    - darling-prefix
    compile-flags:
    - -std=gnu11
    - -D_DARWIN_C_SOURCE
    - -Wall
    - -Wextra
    - -Werror
  xnu-signal-runtime-proof:
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: guarded
    repo: darling-workspace
    red: true
    red-proof:
      mode: guest-runtime-deploy
      bad-profile: current-minus-patch
      expect-failure-phase: run
      cmake-defines:
        DARLING_EUNION: true
      source-modules:
      - darling
      - darling/src/external/darlingserver
      - darling/src/external/dyld
      runtime-artifacts:
      - module: darling/src/external/xnu
        build-targets: [system_kernel]
        deploy: [usr/lib/system/libsystem_kernel.dylib]
      - module: darling/src/external/dyld
        build-targets: [dyld]
        deploy: [usr/lib/dyld]
    timeout-seconds: 90
    requires: [darling-prefix]
    env-vars:
      DARLING_ROOTLESS: '1'
      DARLING_NOOVERLAYFS: '1'
      DARLING_EUNION: '1'
patches:
- path: darling/rootless-homebrew-coreservices.patch
  module: darling
  source-branch: fix/rootless-homebrew-coreservices
  source-base: 681329d6b6cb007e86316c572b138de88f1cfb8b
  source-commit: 23ccdeddaf85df02ef1c0e9570d2103308e21d2e
  bead: dar-gwn.7
  publication-status: blocked
  publication-blocker: Complete stock wget source-install acceptance and portable rootless closure coverage remain under dar-gwn.7.
  test-exception:
    reason: manual-runtime-regression
    scope: CoreServices loading was reproduced through unmodified libunistring test-alignasof and passed after closure deployment; the portable dynamic-loader regression belongs to dar-gwn.7.
  sha256sum: d620056b44fc4a2dee128ef8317621f9f1f93ed37b9a56f561f3c7ac245be3fa
- path: xnu/eunion-content-fd-validation.patch
  module: darling/src/external/xnu
  source-branch: fix/eunion-content-fd-validation
  source-base: 812e6e820009dde5f5af832233ebd120b7258fb6
  source-commit: f1575e01386ca9068626f9cd9ebc7d2872183b99
  bead: dar-gwn.7
  publication-status: blocked
  publication-blocker: Deployed guest regression and complete stock wget acceptance remain under dar-gwn.7.
  tests:
  - name: eunion_content_fd_validation
    kind: contract
    coverage-tier: host
    runs: host
    diag: bare
    red: true
    red-proof:
      mode: source-base
      source-env: XNU_SRC_ROOT
      expect-output-contains:
      - 'FAIL  FT negative descriptor reports EBADF'
    runner: source-contract-script
    repo: darling-workspace
    script: experiments/e-union/run.sh
    timeout-seconds: 60
    note: Execute production ftruncate and E-UNION copy-up; rejected descriptors must report EBADF without copying up or mutating LOWER.
  sha256sum: 9ca0a7dd504aff7dd8d79a14fbb69a74bea1ad8975127bee716c8030c5fad69e
- path: darlingserver/preserve-wait-state-on-resume.patch
  module: darling/src/external/darlingserver
  source-branch: fix/preserve-wait-state-on-resume
  source-base: a99d52248f437be96239a22c8ce5f58fbf32d221
  source-commit: d6ca60236ea0ab0d9adefb05afe63eb3ed03b3fc
  bead: dar-gwn.7
  publication-status: blocked
  publication-blocker: Full guest acceptance and a portable waitq-enrollment regression remain under dar-gwn.7.
  test-exception:
    reason: manual-runtime-regression
    scope: The libunistring mutex stage reproduced a waitq double-enrollment panic and passed on the diagnostic runtime; a deterministic raw-lock-within-XNU-wait fixture belongs to dar-gwn.7.
  sha256sum: 0b9bc8985605d335be4c25088480dc5edc756a141ea340175617e48e24c4d82c
- path: darlingserver/microthread-dispatch-handoff.patch
  module: darling/src/external/darlingserver
  source-branch: fix/microthread-dispatch-handoff
  source-base: d6ca60236ea0ab0d9adefb05afe63eb3ed03b3fc
  source-commit: 9be2568f5489684168f61cb1dfecf76d0cc50849
  bead: dar-gwn.7
  publication-status: blocked
  publication-blocker: Full guest acceptance and portable overlapping-dispatch runtime proof remain under dar-gwn.7; model coverage is not runtime coverage.
  tests:
  - name: microthread_dispatch_handoff_model
    kind: contract
    coverage-tier: model
    runs: host
    diag: bare
    red: true
    red-proof:
      mode: self
      why-self: The fixture executes the old lost-dispatch model and the production execution-ownership state machine with the same overlapping calls and duplicate dispatch attempts.
      expect-output-contains:
      - MICROTHREAD_OLD_DISPATCH_LOST_CALL
      - MICROTHREAD_DISPATCH_HANDOFF_OK
    runner: c-fixture
    repo: darling-workspace
    script: tests/microthread_dispatch_contract.cpp
    source-env: DSERVER_SRC_ROOT
    cc: c++
    include-dirs:
    - internal-include
    compile-flags:
    - -std=c++17
    - -Wall
    - -Wextra
    - -Werror
  sha256sum: f995e131dfebc952cb25c143c1d5d42c4d8ec8b3e975c693c25010de26976ccd
- path: xnu/posix-spawn-cloexec-default.patch
  module: darling/src/external/xnu
  source-branch: fix/posix-spawn-cloexec-default
  source-base: 5f26a4c2365d9774b5a1e66ae7da20b61ab6d2db
  source-commit: 3332f4035976af51133bc4fd296f3bb0cd6c897a
  bead: dar-gwn.7
  publication-status: blocked
  publication-blocker: Canonical combined-runtime materialization and complete stock wget acceptance remain under dar-gwn.7.
  tests:
  - name: posix_spawn_cloexec_default_guest
    use: spawn-cloexec-guest
    note: Prepared-runtime gate for successful CLOEXEC_DEFAULT exec, ordinary descriptor closure, and legacy FD 1023 object inheritance; no automatic bad-runtime deployment is claimed.
  sha256sum: e1dbccc547fc540ba159741aef4a12d5f2339ed0b44c00f705a25b635b3b30ef
- path: darlingserver/rootless-server-owned-socket-address.patch
  module: darling/src/external/darlingserver
  source-branch: fix/rootless-server-owned-socket-address
  source-base: a2f99243227c57847308527a2a921d1bb77b1135
  source-commit: 1422236fb030234ed9ec52216da04087cac9de84
  bead: dar-gwn.7
  publication-status: blocked
  publication-blocker: Canonical combined-runtime materialization and complete stock wget acceptance remain under dar-gwn.7; the foundational rootless publication gate is unchanged.
  tests:
  - name: rootless_socket_owner_exec_guest
    use: spawn-cloexec-guest
    note: Use the prepared rootless runtime; spawned children must check in after CLOEXEC_DEFAULT closes inherited application descriptors.
  sha256sum: 0424b780b0c4d309e63e56cbeae6594acbe045d0c8f93d71b4d36836916e5c8c
- path: darling/rootless-shutdown-guest-tree.patch
  module: darling
  source-branch: fix/rootless-shutdown-guest-tree
  source-base: 681329d6b6cb007e86316c572b138de88f1cfb8b
  source-commit: c02cdd1220ee3907458f418714055f5aeb2f5c4d
  bead: dar-gwn.8
  publication-status: blocked
  publication-blocker: Local lifecycle repair; canonical rootless composition and publication review remain under dar-gwn.7.
  tests:
  - name: rootless_shutdown_guest_tree_host
    kind: contract
    coverage-tier: host
    runs: host
    diag: bare
    runner: c-fixture
    repo: darling
    script: src/startup/tests/rootless_shutdown_session_test.c
    source-files:
    - src/startup/rootless_shutdown.c
    compile-flags: [-D_GNU_SOURCE, -std=gnu11, -Wall, -Wextra, -Werror]
    timeout-seconds: 20
    note: Real nested sessions, RPC-dependent TERM handlers, late forks and service restarts must drain before the live subreaper is terminated.
  - name: rootless_shutdown_active_guest
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: guarded
    runner: guest-runtime-script
    repo: darling-workspace
    script: tests/run-rootless-shutdown-session.sh
    ok-marker: WEST_ROOTLESS_SHUTDOWN_SESSION_OK
    timeout-seconds: 60
    requires: [darling-prefix]
    env-vars:
      DARLING_ROOTLESS: '1'
      DARLING_NOOVERLAYFS: '1'
      DARLING_EUNION: '1'
  sha256sum: 533080c4f3b6195a537449b48f27fc4ae72c26cd6cbd831c9c2266706a673278
- path: darling/runtime-prefix-unlink-race.patch
  module: darling
  source-branch: fix/runtime-prefix-unlink-race
  source-base: 681329d6b6cb007e86316c572b138de88f1cfb8b
  source-commit: f43cbf12a701fa4308a9ba166f88c671765f0499
  bead: dar-gwn.8
  publication-status: blocked
  publication-blocker: Canonical rootless composition and publication review remain under dar-gwn.7.
  tests:
  - name: runtime_prefix_concurrent_unlink_host
    kind: contract
    coverage-tier: host
    runs: host
    diag: bare
    runner: c-fixture
    repo: darling
    script: src/startup/tests/runtime_mode_test.c
    source-files:
    - src/startup/runtime_credentials.c
    - src/startup/runtime_mode.c
    - src/startup/runtime_mode_prefix.c
    compile-flags: [-D_GNU_SOURCE, -DDARLING_RUNTIME_PREFIX_LIFECYCLE_TESTING=1, -std=gnu11]
    timeout-seconds: 60
    note: A real child removes the inspected entry before the parent unlinks it; optional cleanup succeeds while strict disappearance and other errors still fail.
  sha256sum: 42bbb6bb7dfdb761902c26cb26a794b5b6e39a4c7dbca3f17e195e0124355154
- path: darling/runtime-lifecycle-owner.patch
  module: darling
  source-branch: fix/runtime-lifecycle-owner
  source-base: c02cdd1220ee3907458f418714055f5aeb2f5c4d
  source-commit: 58111ee357fa6d9d971f0aa1d1763321604525f6
  bead: dar-gwn.8
  publication-status: blocked
  publication-blocker: Canonical rootless composition and publication review remain under dar-gwn.7.
  tests:
  - name: runtime_lifecycle_owner_host
    kind: contract
    coverage-tier: host
    runs: host
    diag: bare
    runner: c-fixture
    repo: darling
    script: src/startup/tests/runtime_mode_test.c
    source-files:
    - src/startup/runtime_credentials.c
    - src/startup/runtime_mode.c
    - src/startup/runtime_mode_prefix.c
    compile-flags: [-D_GNU_SOURCE, -DDARLING_RUNTIME_PREFIX_LIFECYCLE_TESTING=1, -std=gnu11]
    timeout-seconds: 60
    note: Competing processes must acquire runtime lifecycle ownership exclusively and transfer it after release.
  - name: rootless_concurrent_shutdown_guest
    kind: guest
    coverage-tier: runtime
    runs: guest
    diag: guarded
    runner: guest-runtime-script
    repo: darling-workspace
    script: tests/run-rootless-shutdown-session.sh
    ok-marker: WEST_ROOTLESS_SHUTDOWN_SESSION_OK
    timeout-seconds: 60
    requires: [darling-prefix]
    env-vars:
      DARLING_ROOTLESS: '1'
      DARLING_NOOVERLAYFS: '1'
      DARLING_EUNION: '1'
  sha256sum: 9fe29b5cc1cd5e19723b7e858fdeef243cb0d5835bb9a5d1e7981322433ba1c7
- path: xnu/posix-spawn-failure-ownership.patch
  module: darling/src/external/xnu
  source-branch: fix/posix-spawn-failure-ownership
  source-base: 3332f4035976af51133bc4fd296f3bb0cd6c897a
  source-commit: e8c8127d553578929d3867e35b14d9fc5c5edcae
  bead: dar-3jw9
  publication-status: blocked
  publication-blocker: Supported native/current-minus/fixed runtime proof and private-child identity prerequisites are complete under dar-759a.5; owning-patch publication review and explicit authorization remain under dar-3jw9. Full wget acceptance is not this patch's gate.
  tests:
  - ctest-name: darling/posix_spawn_failure_ownership
    use: xnu-signal-runtime-proof
    red-proof:
      expect-output-contains:
      - POSIX_SPAWN_FAILURE_OWNERSHIP_BROKEN
    note: One source-owned CTest fixture is shared with macOS. The typed wget-residual composition supplies current-minus and fixed sources; infrastructure failures are not semantic RED.
  - ctest-name: macos/posix_spawn_failure_ownership
    coverage-tier: runtime
    runs: macos
    diag: bare
    repo: darling-workspace
  sha256sum: 5a8cf8a30e2eb44e4d987f5263cd966e389c3c13bd210313cfc2fea7fbe9c153
- path: xnu/sigpending-mask-copyout.patch
  module: darling/src/external/xnu
  source-branch: fix/sigpending-mask-copyout
  source-base: e8c8127d553578929d3867e35b14d9fc5c5edcae
  source-commit: 0e54f6a1261216f2eafb880b534288f349027901
  bead: dar-759a.5.3
  publication-status: blocked
  publication-blocker: Deployed pending-mask RED/GREEN is complete under dar-759a.5.3; canonical publication review and explicit authorization remain outstanding. SIG_IGN pending discard is a separate defect under dar-cpuk.
  tests:
  - ctest-name: darling/sigpending_mask_copyout
    use: xnu-signal-runtime-proof
    timeout-seconds: 30
    red-proof:
      expect-output-contains:
      - SIGPENDING_MASK_COPYOUT_BROKEN
  - ctest-name: macos/sigpending_mask_copyout
    coverage-tier: runtime
    runs: macos
    diag: bare
    repo: darling-workspace
  sha256sum: 1004217e0475ca35ca8cd7a5d224bcc5a5058807dec49fcbdd9aa0e479f5d4a5
- path: xnu/sigaction-ignore-discard.patch
  module: darling/src/external/xnu
  source-branch: fix/sigaction-ignore-discard
  source-base: 0e54f6a1261216f2eafb880b534288f349027901
  source-commit: 8a2b2f11325cd647495a03fa309d0851fc48fd2f
  bead: dar-cpuk
  publication-status: blocked
  publication-blocker: dar-cpuk owns deployed pending-discard regression and canonical review; publication is not authorized.
