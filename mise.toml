[tools]
uv = "0.8.17"
"pipx:west" = { version = "1.5.0", depends = ["uv"] }
# Rootless COW lanes need special-node copy-up; stable fuse-overlayfs 1.18 lacks it.
"cargo:https://github.com/containers/fuse-overlayfs" = "rev:9afb0e41dae1d5ea782ff1aa2806729f746d60fc"

[tasks.dw]
description = "Run workspace orchestration"
file = "bin/dw"
raw_args = true
raw = true
quiet = true

[tasks.west]
description = "Run pinned West commands"
run = "exec west"
dir = "{{cwd}}"
raw_args = true
raw = true
quiet = true
